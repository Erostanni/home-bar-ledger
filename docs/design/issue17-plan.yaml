version: 1
plan:
  name: '#17 第二轮：酒柜 + 调制页 视觉升级'
  objective: |
    在不改动信息架构与功能的前提下，为「家庭调酒台账」HBL 的酒柜页与调制页做一轮高级感视觉升级：
    酒柜要真实感、网格化、原木质感、每个柜格有顶光、文字阴影等细节；
    调制页参考顶级酒吧酒单风格，左栏做出真实酒单的感觉，右栏通过字体与排版让酒名、原料、做法有明确区分。
    交付必须构建一致、189 项既有测试全绿、深浅双主题与移动端均无回归。
  max_concurrency: 1
  max_cycles: 8
  max_consecutive_failures: 2

tasks:

  # ─────────────────────────── 1. 设计规范 ───────────────────────────
  - id: design-spec
    title: '产出酒柜页与调制页的设计规范'
    assigned_to: ui-designer
    timeout_ms: 1500000
    prompt: |
      你负责为「家庭调酒台账 HBL」这一轮改版产出**设计规范文档**，不写实现代码。

      ## 项目现状（必须先自己看，不要凭想象）
      - 仓库：/workspace/hbl/repo（git 工作区干净，当前 HEAD = f2d5024）
      - 源码唯一入口：build/app.template.html（内联 CSS + JS，编译后产出根目录 index.html）
      - 现状截图（当前真实状态）：/workspace/hbl/repo/preview/01-cabinet.png（酒柜）、
        preview/02-mix.png（调制）、preview/03-recipe.png（配方详情）、preview/07-mobile.png（移动端）
      - 数据：663 款配方 / 262 种原料，全中文；页面：酒柜 / 调制 / 台账 / 账单
      - 深浅双主题，主题变量在 :root 与 html[data-theme="light"] 两处

      ## 用户的原始需求（本轮范围：只做酒柜页 + 调制页）
      1. **酒柜页**：要有「真实的感觉」，网格化，原木感，带一点**每个柜子的顶光**、**文字阴影**等细节。
      2. **调制页**：参考 **bar us 等顶级酒吧的酒单风格**。左栏希望有**真实酒单的感觉**；
         右侧希望**美化字体、排版**，尽量让**酒名、原料、做法**产生区别。

      ## 顶级酒吧酒单的排版要点（供你参考，但不要照抄某一家）
      酒名的字体和字号最大最醒目；描述用更小更素的无衬线或细衬线；分类用极小的全大写字距拉开的
      标签；条目之间用极细的分隔线；价格/数字右对齐且用等宽数字；整体深色底 + 铜/金点缀；
      字体数量控制在 2–3 种以内，靠字重/字号/字距/颜色做层级，而不是靠换字体。

      ## 硬约束（必须遵守，违反即不合格）
      - **禁止任何外部资源**：不得使用网络字体、CDN、外链图片。
      - **字体只能用系统字体栈**。注意：CSS 里的 --serif 声明了 "Playfair Display" 但**实际没有加载**，
        真正生效的是系统衬线（宋体/Songti SC/Georgia/Times New Roman）。
        所以「酒单感」必须靠**排版细节**（字重、字号、字距、行高、细分隔线、留白、颜色层级）做出来，
        不是靠换字体。规范里要写清楚这一点。
      - 纹理（木纹等）只能用 CSS 渐变或 **SVG data-URI 内联**，不能引用外部图片。
      - **禁止大面积 backdrop-filter 模糊**（550KB 单文件，滚动会掉帧），效果优先用渐变与阴影实现。
      - **只改视觉与排版，不得改变信息架构与功能行为**：不新增/删除功能、不改数据结构、
        不改交互流程、不折叠筛选、不改页面布局结构。
      - 深色与浅色两套主题都要给出方案。
      - 性能：木纹等纹理不要用大尺寸 repeating 渐变铺满全页导致合成开销大，给出具体实现方式与尺寸建议。

      ## 产出物
      写到 **/workspace/hbl/repo/docs/design/issue17-spec.md**，结构如下：

      1. **现状诊断**：基于你实际看过的截图与代码，逐条指出「哪里不够高级 / 哪里最影响质感」，
         要具体到选择器与画面位置，不要写「更有质感」这种空话。
      2. **设计 token 表**：新增哪些 CSS 变量、名称、取值（颜色/尺寸/字重/字距/阴影/渐变角度/透明度），
         深色浅色各一套。已有的变量要说明是复用还是覆盖。
      3. **酒柜页规格**：木纹材质做法（具体 CSS 写法）、网格化如何呈现、顶光如何模拟
         （射灯光锥/顶部渐变/卡片内高光，写清渐变参数）、文字阴影的具体值与作用对象、
         卡片层级与悬停反馈。逐条标注应用到哪个选择器。
      4. **调制页规格**：左栏酒单感的具体做法（分类标签、分隔线、酒名字体字号、条目节奏）；
         右栏酒名/原料/做法三者的排版区分方案（各自的字体族、字号、字重、字距、颜色、间距），
         以及份数控件、库存标签、成本数字的层级安排。
      5. **可实现性标注**：哪些效果纯 CSS 可做、哪些需要 JS 或需要开发 agent 判断。
      6. **验收标准**：可被测试 agent 逐条核对的主观判断项，转成可观察的现象描述
         （例如「酒名与原料名在视觉上明显不同族」「卡片顶部有一条从上往下渐隐的高光」）。

      写完后，在你的交付说明里用 5–8 行总结：这一轮的核心设计主张是什么、哪 3 条最关键、
      有没有你拿不准需要开发 agent 判断的点。不要写代码。
    verified_by:
      - ui-tester
    verify_prompt: |
      你是独立验证者。请只读地检查 /workspace/hbl/repo/docs/design/issue17-spec.md 这份设计规范，
      **不要修改任何文件**。

      逐条核对：
      1. **是否覆盖用户需求**：酒柜是否给了「原木质感 / 网格化 / 每个柜格顶光 / 文字阴影」的具体做法；
         调制页是否给了「左栏真实酒单感」和「右栏让酒名、原料、做法有排版区别」的具体做法。
         缺哪一条就点名缺哪一条。
      2. **是否可落地**：每条设计决策是否都给出了具体数值/选择器，而不是形容词。
         抽查 3 条，判断开发 agent 能否照着直接写 CSS。
      3. **是否违反硬约束**：有没有引入网络字体、CDN、外链图片、大面积 backdrop-filter、
         改变信息架构/功能行为的建议？有就 FAIL。
      4. **深浅双主题**：是否两套主题都给了取值。
      5. **验收标准**：是否可被客观观察验证。

      结论用 PASS / FAIL 给出，FAIL 时列出必须补齐的条目。

  # ─────────────────────────── 2. 实现 ───────────────────────────
  - id: implement
    title: '按规范实现酒柜页与调制页的视觉升级'
    assigned_to: ui-developer
    depends_on:
      - design-spec
    timeout_ms: 1800000
    prompt: |
      你的任务是**把设计规范落地成代码**，不要自行发明设计方案。

      ## 输入
      - 设计规范（先完整读一遍）：/workspace/hbl/repo/docs/design/issue17-spec.md
      - 仓库：/workspace/hbl/repo
      - 源码唯一入口：build/app.template.html
        （内联 <style> 在文件头部，JS 渲染函数在文件后半部分；酒柜页是 viewCabinet，
          调制页是 viewMix 与 recipeDetail）
      - 现状截图：/workspace/hbl/repo/preview/01-cabinet.png、02-mix.png、03-recipe.png、07-mobile.png

      ## 环境（已就绪，不要重复安装）
      - npm 依赖已装好（jsdom、playwright），node_modules 在仓库里
      - playwright chromium 已安装

      ## 硬约束
      - 禁止任何外部资源：网络字体、CDN、外链图片一律不许。字体只用系统字体栈；
        木纹等纹理只用 CSS 渐变或 SVG data-URI 内联。
      - **只改视觉与排版，不改信息架构与功能行为**：不新增/删除功能、不改数据结构、
        不改交互流程、不折叠筛选、不改页面布局结构。
      - 不得破坏既有测试：现有 189 项 jsdom 测试 + 浏览器端到端必须全绿。
      - 特别注意 build/browser-test.js 里有一段 **[回归] Issue #24** 断言
        （酒柜卡片悬浮时编辑/删除按钮不得与名称行/分类标签重叠）——你的改动不能让它失败。
        如果你的新样式让按钮与文字重新相交，必须在样式层面解决（给文字/按钮让位），
        而不是改掉那条测试。
      - 性能：禁止大面积 backdrop-filter；阴影层数控制在 2–3 层以内。
      - **不要 git push**。提交由我来做。

      ## 执行步骤
      1. 读规范 + 读相关代码，列出你要改的选择器清单。
      2. 实现。改动集中在 <style> 段与必要的小幅标记调整。
      3. 重新构建：python3 build/compile.py
      4. 跑测试：npm test（应 ≥189 通过 0 失败）、npm run test:browser（应全绿无 JS 错误）
      5. 自检构建一致性：python3 build/compile.py 后 git diff --exit-code -- index.html 必须为空。
      6. 截图取证（用 playwright，存到仓库外的目录，不要污染仓库）：
         - 桌面 1527×983：酒柜页、调制页、配方详情弹窗，深色 + 浅色
         - 移动端 375×812（触摸模式）：酒柜页、调制页，深色
         - 酒柜页额外抓一张：鼠标 hover 在某张原料卡上（验证 #24 不回归 + 顶光效果）
      7. 交付说明里写：改了哪些选择器、每处对应的规范条目、测试结果数字、
         截图路径清单、**以及实现中你自行决定的部分**（规范没写清楚的地方）。

      ## 交付前自检清单
      - [ ] 深色/浅色都看过截图，没有文字截断、重叠、横向溢出
      - [ ] 移动端 375px 无横向滚动，触摸目标 ≥28px
      - [ ] 木纹/顶光效果在深色下明显但不脏，浅色下不糊
      - [ ] 酒单感的排版层级一眼能分出「酒名 / 原料 / 做法」
      - [ ] npm test 与 npm run test:browser 全绿
    verified_by:
      - ui-tester
    verify_prompt: |
      你是独立验证者，**不要修改项目文件**。自己跑命令、自己看截图，不要只读 diff。

      1. **功能回归**：cd /workspace/hbl/repo && npm test —— 报出通过/失败数字，失败要指出是哪条断言。
      2. **浏览器端到端**：npm run test:browser —— 报出是否全绿、有无 JS 错误、
         特别是 **[回归] Issue #24** 那一段是否仍然通过。
      3. **构建一致性**：python3 build/compile.py 之后 git diff --exit-code -- index.html 是否为空。
      4. **视觉验收**：自己用 playwright 抓图（桌面 1527×983 + 移动端 375×812，深浅双主题，
         酒柜页还要抓 hover 态），把图**看一遍**，用眼睛判断：
         - 木纹材质是否可见但不过分、顶光是否像射灯而不是简单渐变
         - 文字有没有被截断/重叠/溢出
         - 酒单感是否成立：酒名、原料、做法三者的排版区别是否一眼可辨
         - 浅色主题下层次是否还在（不是糊成一片）
         截图存仓库外目录，不要污染仓库。
      5. **规范符合性**：逐条对照 /workspace/hbl/repo/docs/design/issue17-spec.md 的「验收标准」，
         给出「已达标 / 未达标」逐条结论，未达标写清具体选择器与具体现象。
      6. **边界**：空数据（无原料、无记录）、超长原料名/分类名、375px 移动端。

      结论 PASS / FAIL。FAIL 时给出精确复现步骤与期望值。

  # ─────────────────────────── 3. 测试与验收 ───────────────────────────
  - id: test-coverage
    title: '补齐测试并产出最终验收报告'
    assigned_to: ui-tester
    depends_on:
      - implement
    timeout_ms: 1500000
    prompt: |
      你是本轮的测试负责人，负责把验证变成**可重复的资产**并产出最终验收结论。

      ## 输入
      - 实现产物已在 /workspace/hbl/repo（build/app.template.html 已改，index.html 已重新编译）
      - 设计规范：/workspace/hbl/repo/docs/design/issue17-spec.md

      ## 任务
      1. **补测试**（可以改 build/test.js 与 build/browser-test.js，这两个是测试文件，允许改）：
         - 为本轮新增的视觉规则补上**能真正抓到回归**的断言。注意：jsdom 没有布局引擎，
           断不了「重叠」这类问题 —— 这类断言要放在 build/browser-test.js 里用 playwright 量
           getBoundingClientRect 来做（参考那里已有的 [回归] Issue #24 那一段的写法）。
         - 至少覆盖：酒柜卡片的顶光/材质样式确实生效（如 ::after 高光伪元素存在、
           背景含木纹渐变特征）、调制页酒名/原料/做法的排版差异确实存在
           （如不同 font-family / font-size 的计算样式值不同）。
         - 断言必须能在**旧代码上失败、在新代码上通过**。写完自己验证这一点：
           用 git stash 把 build/app.template.html 临时换回旧版跑一次，确认新断言会红；
           然后恢复。**务必确保仓库最终状态是新版**。
         - 现有 189 项测试一条都不能少、不能改语义。
      2. **跑全套验证并记录**：npm test、npm run test:browser、构建一致性检查，
         报出具体数字。
      3. **最终视觉验收**：桌面 + 移动端、深色 + 浅色，自己抓图自己看，
         逐条对照规范的验收标准给结论。
      4. **产出验收报告**：写到 /workspace/hbl/repo/docs/design/issue17-acceptance.md，
         内容包括：测试数字、新增断言清单、逐条规范符合性结论、发现的遗留问题（若有）、截图路径。
      5. **不要 git push**。

      交付说明里报：新测试总数、通过/失败、构建一致性是否通过、验收结论（通过/有遗留问题）。
    role: verify-as-task
    verify_prompt: |
      你是独立验证者，只读检查，不要修改项目文件。
      1. cd /workspace/hbl/repo && npm test —— 确认通过数 ≥ 原 189 且失败 0。
      2. npm run test:browser —— 确认全绿、无 JS 错误、Issue #24 回归段仍通过。
      3. 确认 build/test.js 与 build/browser-test.js 里新增的断言**真的能抓回归**：
         用 git stash 临时换回旧模板跑一次，确认至少一条新断言会失败（然后恢复，
         最后必须确认 git status 显示模板是新版、测试文件是新版本）。
      4. 读 /workspace/hbl/repo/docs/design/issue17-acceptance.md，
         确认报告里的数字与你自己跑出来的一致（不要采信报告里的数字，自己跑一遍对）。
      5. 确认仓库最终状态可交付：git status 干净或仅含预期改动、index.html 与模板一致。

      结论 PASS / FAIL，FAIL 时列出必须补齐的具体条目。
