<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家庭调酒台账 · Home Bar Ledger</title>
<style>
:root{
  /* 表面 */
  --bg:#14100d; --panel:#1d1712; --panel2:#241d17; --panel3:#1a1410;
  --line:#3a2f24; --line2:#4a3b2c;
  /* 前景 */
  --tx:#ece3d5; --tx2:#ddd3c4; --mu:#a08d75; --mu2:#7d6c58;
  /* 强调色（可换） */
  --gold:#d9a441; --gold-d:#8a6420; --gold-l:#e0ae4b; --gold-ink:#1a1409;
  --ok:#7fa35c; --warn:#d38b3a; --bad:#c0553f;
  /* 纸面（小票，独立配色，不随主题变） */
  --paper:#f6f1e4; --ink:#2b2620;
  /* 背景纹理 */
  --tex-opacity:.5; --tex-filter:none; --tex-size:260px;
  --topbar:rgba(20,16,13,.94);
  --tabs-bg:rgba(0,0,0,.28);
  --tabs-hover:rgba(255,255,255,.04);
  --inset:rgba(255,255,255,.035);
  --mask:rgba(8,6,4,.72);
  /* 其它 */
  --r:10px; --mono:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --serif:"Playfair Display","Songti SC","STSong",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --fs:15px;
  --sh:0 10px 26px rgba(0,0,0,.24);
}

/* ============ 浅色主题 ============ */
html[data-theme="light"]{
  --bg:#ece6db; --panel:#fffdf8; --panel2:#f6f1e7; --panel3:#f0e9dc;
  --line:#ded4c2; --line2:#c6b9a2;
  --tx:#2b2620; --tx2:#4a4238; --mu:#6d6153; --mu2:#8b8070;
  --gold:#a9761f; --gold-d:#7d5615; --gold-l:#c08a2c; --gold-ink:#fffdf8;
  --ok:#4f7a35; --warn:#a8641c; --bad:#a63f2b;
  --tex-opacity:.42; --tex-filter:none;
  --topbar:rgba(255,253,248,.86);
  --tabs-bg:rgba(120,100,70,.10);
  --tabs-hover:rgba(120,100,70,.08);
  --inset:rgba(120,100,70,.06);
  --mask:rgba(60,48,30,.42);
  --sh:0 8px 22px rgba(80,60,30,.10);
}
html[data-theme="light"] body{color:var(--tx)}
html[data-theme="light"] body::after{
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27260%27%20height%3D%27260%27%20viewBox%3D%270%200%20260%20260%27%3E%3Cg%20transform%3D%27rotate%2845%20130.0%20130.0%29%27%3E%3Cg%20transform%3D%27translate%28-1.4%2C-1.4%29%27%20fill%3D%27%233b2c15%27%20stroke%3D%27%233b2c15%27%20opacity%3D%270.16%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%233b2c15%27%20opacity%3D%270.16%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%233b2c15%27%20stroke-width%3D%272%27%20opacity%3D%270.16%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%282.0%2C2.0%29%27%20fill%3D%27%23ffffff%27%20stroke%3D%27%23ffffff%27%20opacity%3D%270.75%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%23ffffff%27%20opacity%3D%270.75%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-width%3D%272%27%20opacity%3D%270.75%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%280%2C0%29%27%20fill%3D%27%236b5326%27%20stroke%3D%27%236b5326%27%20opacity%3D%270.22%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%236b5326%27%20opacity%3D%270.22%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%236b5326%27%20stroke-width%3D%272%27%20opacity%3D%270.22%27%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  filter:none;
}
html[data-theme="light"] body::before{
  background:radial-gradient(900px 500px at 15% -5%, rgba(169,118,31,.10), transparent 60%),
             radial-gradient(700px 500px at 95% 105%, rgba(79,122,53,.08), transparent 60%);
  opacity:1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); min-height:100vh;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:radial-gradient(900px 500px at 15% -5%, rgba(217,164,65,.09), transparent 60%),
             radial-gradient(700px 500px at 95% 105%, rgba(127,163,92,.07), transparent 60%);
}
/* EROS 浮雕满印背景：45° 倾斜的几何 monogram，亮部上左 + 暗部下右 = 浮雕感 */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27260%27%20height%3D%27260%27%20viewBox%3D%270%200%20260%20260%27%3E%3Cg%20transform%3D%27rotate%2845%20130.0%20130.0%29%27%3E%3Cg%20transform%3D%27translate%282.0%2C2.0%29%27%20fill%3D%27%23000000%27%20stroke%3D%27%23000000%27%20opacity%3D%270.3%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%23000000%27%20opacity%3D%270.3%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%23000000%27%20stroke-width%3D%272%27%20opacity%3D%270.3%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%28-1.4%2C-1.4%29%27%20fill%3D%27%23ffffff%27%20stroke%3D%27%23ffffff%27%20opacity%3D%270.1%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%23ffffff%27%20opacity%3D%270.1%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-width%3D%272%27%20opacity%3D%270.1%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%280%2C0%29%27%20fill%3D%27%23e6cf96%27%20stroke%3D%27%23e6cf96%27%20opacity%3D%270.17%27%3E%3Ctext%20x%3D%27130.0%27%20y%3D%27145.8%27%20font-family%3D%27Helvetica%20Neue%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2744%27%20font-weight%3D%27700%27%20letter-spacing%3D%277.0%27%20text-anchor%3D%27middle%27%20fill%3D%27%23e6cf96%27%20opacity%3D%270.17%27%3EEROS%3C%2Ftext%3E%3Cpath%20d%3D%27M130.0%2085.1%20l13.2%2013.2%20l-13.2%2013.2%20l-13.2%20-13.2%20z%27%20fill%3D%27none%27%20stroke%3D%27%23e6cf96%27%20stroke-width%3D%272%27%20opacity%3D%270.17%27%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  background-size:var(--tex-size,260px) var(--tex-size,260px);
  background-repeat:repeat;
  opacity:var(--tex-opacity,.5);
  filter:var(--tex-filter,none);
  transition:opacity .25s var(--ease), filter .25s var(--ease);
}
body.no-bgtex::after{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--gold)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px;
  padding:12px 20px; background:var(--topbar); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold-d)); color:var(--gold-ink);
  font-size:19px; font-weight:700; box-shadow:0 3px 12px rgba(217,164,65,.25);
}
.brand h1{margin:0;font-size:18px;letter-spacing:.2px;font-weight:600;font-family:var(--serif);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.brand p{margin:0;font-size:8.5px;letter-spacing:3.4px;color:var(--mu2);font-family:var(--mono)}

.tabs{display:flex;gap:2px;margin-left:auto;background:var(--tabs-bg);padding:4px;
  border-radius:11px;border:1px solid var(--line)}
.tabs button{
  padding:7px 17px;border-radius:8px;font-size:13px;color:var(--mu);
  transition:.18s var(--ease); white-space:nowrap;letter-spacing:.3px;
}
.tabs button:hover{color:var(--tx);background:var(--tabs-hover)}
.tabs button.on{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--gold-ink);font-weight:600;
  box-shadow:0 2px 10px rgba(217,164,65,.25)}
.iconbtn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);color:var(--mu);
  display:grid;place-items:center;font-size:15px;transition:.15s;
}
.iconbtn:hover{color:var(--gold);border-color:var(--line2);background:var(--panel)}

main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 20px 70px}
.view{display:none;animation:fade .32s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stockcard{animation:rise .34s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.stockcard:nth-child(1){animation-delay:.02s}.stockcard:nth-child(2){animation-delay:.04s}
.stockcard:nth-child(3){animation-delay:.06s}.stockcard:nth-child(4){animation-delay:.08s}
.stockcard:nth-child(5){animation-delay:.1s}.stockcard:nth-child(6){animation-delay:.12s}
.stockcard:nth-child(n+7){animation-delay:.14s}

/* ---------- 通用块 ---------- */
.card{background:linear-gradient(180deg,var(--panel),var(--panel3));border:1px solid var(--line);
  border-radius:13px;padding:17px 19px;position:relative;
  box-shadow:0 1px 0 var(--inset) inset, var(--sh)}
.card h3{font-family:var(--serif);font-size:16px;letter-spacing:.2px}
.card h3{margin:0 0 3px;font-size:14px;font-weight:600;letter-spacing:.3px}
.card .sub{color:var(--mu2);font-size:11.5px;margin-bottom:14px;letter-spacing:.2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sp{flex:1}

.btn{
  padding:8px 15px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx);font-size:13px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--gold-d);background:var(--panel2)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:var(--gold-l)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{
  width:100%;padding:8px 11px;background:var(--panel3);border:1px solid var(--line);
  border-radius:8px;font-size:13.5px;outline:none;transition:.15s;
}
.inp:focus{border-color:var(--gold-d);background:var(--panel3)}
label.lb{display:block;font-size:11px;color:var(--mu);margin-bottom:5px;letter-spacing:.4px}
.empty{text-align:center;color:var(--mu2);padding:38px 16px;font-size:13px}
.empty b{display:block;color:var(--mu);font-size:14px;margin-bottom:6px;font-weight:500}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--mu)}
.pill.ok{color:var(--ok);border-color:rgba(127,163,92,.4)}
.pill.warn{color:var(--warn);border-color:rgba(211,139,58,.4)}
.pill.bad{color:var(--bad);border-color:rgba(192,85,63,.45)}
.pill.gold{color:var(--gold);border-color:rgba(217,164,65,.4)}
.mono{font-family:var(--mono)}
.dim{color:var(--mu)}
.tiny{font-size:11.5px}

/* ---------- 统计条 ---------- */
.stockfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.stockfilter .sfcat{padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel3);
  color:var(--mu);font-size:11.5px;cursor:pointer;transition:.12s;user-select:none}
.stockfilter .sfcat:hover{border-color:var(--gold-d);color:var(--tx)}
.stockfilter .sfcat.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.stockfilter select{padding:5px 9px;background:var(--panel3);border:1px solid var(--line);border-radius:7px;font-size:12px}
.stockfilter .sfcount{font-size:11.5px;color:var(--mu2);margin-left:auto}
/* 指标条：一条连贯的横条，比五张独立卡片更紧凑、更有节奏 */
.metrics{display:flex;flex-wrap:wrap;background:linear-gradient(180deg,var(--panel),var(--panel3));
  border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:20px;
  box-shadow:0 1px 0 var(--inset) inset, var(--sh)}
.metric{flex:1 1 130px;padding:14px 18px 13px;position:relative;min-width:0}
.metric + .metric::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
.metric .k{font-size:9.5px;color:var(--mu2);letter-spacing:1.6px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-family:var(--serif);font-size:27px;line-height:1.05;margin-top:5px;letter-spacing:-.5px;
  display:flex;align-items:baseline;gap:3px}
.metric .v small{font-family:var(--sans);font-size:11.5px;color:var(--mu);font-weight:400;letter-spacing:0}
.metric.accent .v{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .k{font-size:10.5px;color:var(--mu2);letter-spacing:1.3px;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:600;margin-top:3px;font-family:var(--mono);letter-spacing:-.5px}
.stat .v small{font-size:12px;color:var(--mu);font-weight:400}

/* ---------- 酒柜 ---------- */
.stocklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px;
  max-height:calc(100vh - 330px);min-height:180px;overflow-y:auto;padding:2px 4px 2px 2px;align-content:start}
.stocklist::-webkit-scrollbar{width:7px}
.stocklist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.stocklist::-webkit-scrollbar-track{background:transparent}
.stockcard{background:linear-gradient(180deg,var(--panel),var(--panel3));border:1px solid var(--line);
  border-radius:11px;padding:11px 13px 11px 16px;position:relative;transition:.18s var(--ease);
  display:flex;flex-direction:column;min-height:112px;overflow:hidden}
.stockcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2);
  transition:.18s var(--ease)}
.stockcard:hover{border-color:var(--line2);transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(0,0,0,.3)}
.stockcard:hover::before{background:var(--gold)}
.stockcard .nm{font-weight:600;font-size:13px;margin-bottom:2px;padding-right:50px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.stockcard .cat{font-size:10px;color:var(--mu2);letter-spacing:.5px;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.stockcard .bar{margin:8px 0 5px;flex:0 0 auto}
.stockcard .amt{margin-top:auto;padding-top:2px}
.bar{height:4px;border-radius:3px;background:var(--panel3);margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:3px}
.bar i.low{background:linear-gradient(90deg,var(--bad),var(--bad))}
.stockcard .amt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--mu)}
.stockcard .acts{position:absolute;top:11px;right:11px;display:flex;gap:5px;opacity:0;transition:.15s}
.stockcard:hover .acts{opacity:1}
.iconmini{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);color:var(--mu2);display:grid;place-items:center;font-size:12px}
.iconmini:hover{color:var(--gold);border-color:var(--gold-d)}

/* ---------- 调制 ---------- */
.mixwrap{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.mixfrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:5px}
.mixflabel{flex:0 0 28px;font-size:10.5px;color:var(--mu2);letter-spacing:.5px;padding-top:4px}
.mixfrow .sfcat{font-size:11px;padding:2px 8px}
.mixfrow .sfcat i{font-style:normal;opacity:.6;margin-left:3px;font-size:9.5px}
.mixfrow .sfcat.on i{opacity:.75}
.searchbar{position:relative;margin-bottom:11px}
.searchbar .inp{padding-left:32px}
.searchbar::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu2);font-size:15px}
.reclist{max-height:calc(100vh - 230px);overflow-y:auto;padding-right:4px}
.reclist::-webkit-scrollbar{width:6px}
.reclist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.recitem{position:relative;padding:9px 12px;border-radius:8px;cursor:pointer;
  transition:.13s;border:1px solid transparent}
.recitem:hover{background:var(--panel)}
.recitem.on{background:var(--panel2);border-color:var(--gold-d)}
.recitem .rn{font-size:13.5px;font-weight:500}
.recitem .rg{font-size:11px;color:var(--mu2);margin-top:1px}
.recitem .rt{font-size:10.5px;color:var(--mu2);margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.recitem .rt .pill{font-size:9.5px;padding:1px 6px}
.rd{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rd:last-child{border-bottom:none}
.rd .l1{font-size:13.5px}
.rd .l2{font-family:var(--mono);font-size:12px;color:var(--mu);text-align:right;white-space:nowrap}
.rd .st{grid-column:1/-1;font-size:11px;margin-top:-3px}
.stockbar{height:3px;background:var(--panel3);border-radius:2px;margin-top:5px;overflow:hidden}
.stockbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.stockbar i.low{background:var(--bad)}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:7px 0 7px 30px;font-size:13.5px;color:var(--tx2);border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:8px;width:19px;height:19px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line2);color:var(--gold);
  font-family:var(--mono);font-size:10.5px;display:grid;place-items:center;
}
.servings{display:flex;gap:5px;align-items:center}
.servings button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--mu);font-family:var(--mono)}
.servings button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.servings button:hover{border-color:var(--gold-d)}

/* ---------- 台账 ---------- */
.ledgerlist{display:flex;flex-direction:column;gap:9px}
.led{background:linear-gradient(90deg,var(--panel),var(--panel3));border:1px solid var(--line);border-radius:11px;
  padding:12px 15px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;
  transition:.16s var(--ease)}
.led:hover{border-color:var(--line2);background:linear-gradient(90deg,var(--panel2),var(--panel3))}
.led .num{font-family:var(--mono);font-size:10.5px;color:var(--gold-d);width:44px;letter-spacing:.5px}
.led .nm{font-weight:600;font-size:14px;font-family:var(--serif);letter-spacing:.2px}
.led .dt{font-family:var(--mono);font-size:11px;color:var(--mu2);margin-top:2px}
.led .amt{font-family:var(--mono);font-size:12.5px;color:var(--mu);text-align:right;white-space:nowrap}
.led .amt b{color:var(--tx);font-weight:600}
.filterbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filterbar select{padding:7px 10px;background:var(--panel3);border:1px solid var(--line);border-radius:8px;font-size:13px}

/* ---------- 小票 ---------- */
.receiptwrap{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.receipt.paper-classic{background:#f6f1e4;color:#2b2620}
.receipt.paper-white{background:#ffffff;color:#1a1a1a}
.receipt.paper-kraft{background:#dccaa6;color:#3a2f20}
.receipt.paper-dark{background:#16120e;color:#e8dfd0}
.receipt.paper-dark .rrule2{border-top-color:#6b5d48}
.receipt.paper-dark .rrule{border-top-color:#4a3f33}
.receipt.paper-dark .rrow .k,.receipt.paper-dark .rsec,.receipt.paper-dark .rfoot,
.receipt.paper-dark .rstoresub{color:#9c8d78}
.receipt.paper-dark .rbarcode{background:repeating-linear-gradient(90deg,#e8dfd0 0 1px,transparent 1px 3px,#e8dfd0 3px 5px,transparent 5px 7px,#e8dfd0 7px 8px,transparent 8px 11px)}
.receipt .rbg{position:absolute;inset:0;pointer-events:none;z-index:0;background-size:cover;background-position:center;opacity:var(--rbgop,.25)}
.receipt > *:not(.rbg){position:relative;z-index:1}
.receipt{
  width:320px;max-width:100%;margin:0 auto;background:var(--paper);color:var(--ink);
  padding:24px 20px 22px;font:12px/1.6 var(--mono);position:relative;
  box-shadow:0 20px 55px rgba(0,0,0,.5);color-adjust:exact;-webkit-print-color-adjust:exact;
}
.receipt::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(120,100,70,.05) 0 1px,transparent 1px 3px);
}
.rcenter{text-align:center}
.rlogo{font-size:19px;letter-spacing:5px;font-weight:700;margin-bottom:3px}
.rsub{font-size:9.5px;letter-spacing:2.4px;color:#7a6b55;margin-bottom:12px}
.rstore{font-size:14px;letter-spacing:2px;font-weight:700;margin-bottom:2px}
.rstoresub{font-size:9px;letter-spacing:1.6px;color:#7a6b55;margin-bottom:12px}
.rrule{border:none;border-top:1px dashed #a3947a;margin:9px 0}
.rrule2{border:none;border-top:3px double #6f6047;margin:12px 0}
.rrow{display:flex;justify-content:space-between;gap:10px}
.rrow .k{color:#5c5142}
.rrow .v{font-weight:600;white-space:nowrap}
.rrow.g3{display:grid;grid-template-columns:1fr auto 58px;gap:8px;align-items:baseline}
.rrow.g3 .amt{text-align:right;font-weight:600}
.rrow.g3 .rname{font-weight:400}
.rsec{font-size:9.5px;letter-spacing:1.8px;color:#7a6b55;margin:12px 0 5px;text-transform:uppercase}
.rname{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfoot{text-align:center;margin-top:16px;font-size:10px;color:#6b5d48;letter-spacing:1px}
.rbarcode{
  margin:14px auto 0;width:112px;height:38px;
  background:repeating-linear-gradient(90deg,#3a3128 0 1px,transparent 1px 3px,#3a3128 3px 5px,transparent 5px 7px,#3a3128 7px 8px,transparent 8px 11px);
}
.rtot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:3px 0}
.bigline{border-top:1px solid #b8a88c;margin-top:7px;padding-top:6px}
.printbar{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:var(--mask);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:15px}
.modal .body{padding:18px 20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.modal.wide{max-width:780px}
.settabs{display:flex;gap:3px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel3)}
.settab{padding:10px 15px;border-radius:8px 8px 0 0;color:var(--mu);font-size:13px;
  border:1px solid transparent;border-bottom:none;margin-bottom:-1px;transition:.12s}
.settab:hover{color:var(--tx)}
.settab.on{color:var(--gold);background:var(--panel);border-color:var(--line)}
.setpanel{padding:16px 20px 4px}
.setsection{margin-bottom:20px}
.setsection:last-child{margin-bottom:6px}
.setlabel{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu2);
  margin:0 0 8px;display:flex;align-items:center;gap:8px}
.setlabel::after{content:"";flex:1;height:1px;background:var(--line)}
.setrow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .stxt{flex:1;min-width:0}
.setrow .stitle{font-size:13.5px;color:var(--tx)}
.setrow .sdesc{font-size:11.5px;color:var(--mu2);margin-top:2px;line-height:1.55}
.setrow .sctl{flex:0 0 auto;display:flex;align-items:center;gap:8px}
/* 开关 */
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--panel3);
  border:1px solid var(--line2);cursor:pointer;transition:.22s var(--ease);flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--mu2);transition:.22s var(--ease)}
.sw.on{background:var(--gold);border-color:var(--gold)}
.sw.on::after{transform:translateX(18px);background:var(--gold-ink)}
.sw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 主题卡片 */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.theme{border:1.5px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;
  background:var(--panel3);transition:.16s var(--ease)}
.theme:hover{border-color:var(--line2)}
.theme.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.15)}
.theme .prev{height:44px;display:flex;align-items:flex-end;gap:3px;padding:7px}
.theme .prev i{display:block;height:9px;border-radius:2px;flex:1}
.theme .prev i:first-child{height:16px}
.theme .nm{font-size:11px;color:var(--mu);padding:5px 8px 6px;text-align:center;border-top:1px solid var(--line)}
.theme.on .nm{color:var(--gold)}
/* 色板 */
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:.15s;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.swatch:hover{transform:scale(1.12)}
.swatch.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--panel),0 0 0 5px currentColor}
/* 分段控件 */
.seg{display:inline-flex;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 13px;border-radius:6px;font-size:12px;color:var(--mu);background:none;border:none;cursor:pointer;transition:.14s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
/* 滑块 */
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--panel3);
  border:1px solid var(--line);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--gold);border:2px solid var(--panel);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.setval{font-family:var(--mono);font-size:11.5px;color:var(--mu);min-width:42px;text-align:right}
/* 危险区 */
.setdanger{border:1px solid rgba(192,85,63,.35);border-radius:11px;padding:4px 13px;background:rgba(192,85,63,.06)}
.setdanger .setlabel{color:var(--bad)}
.setdanger .setlabel::after{background:rgba(192,85,63,.25)}
.setdanger .setrow{border-bottom-color:rgba(192,85,63,.18)}
/* 无动效 */
html.no-motion *{animation:none !important;transition:none !important}
.setgrid{display:grid;grid-template-columns:1fr 268px;gap:22px;align-items:start}
.setaside{position:sticky;top:0}
.setaside .cap{font-size:10.5px;color:var(--mu2);letter-spacing:1.1px;margin-bottom:8px;text-transform:uppercase}
.papers{display:flex;gap:7px;flex-wrap:wrap}
.pchoice{width:46px;height:46px;border-radius:9px;border:2px solid var(--line);cursor:pointer;
  display:grid;place-items:center;font-size:10px;color:#6b5d48;transition:.15s;position:relative}
.pchoice:hover{border-color:var(--gold-d);transform:translateY(-1px)}
.pchoice.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,164,65,.16)}
.pchoice.on::after{content:"✓";position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;
  background:var(--gold);color:var(--gold-ink);font-size:10px;display:grid;place-items:center;font-weight:700}
.pchoice.paper-classic{background:#f6f1e4}.pchoice.paper-white{background:#fff;color:#333}
.pchoice.paper-kraft{background:#dccaa6}.pchoice.paper-dark{background:#16120e;color:#c9bda9}
.previewwrap{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:14px;
  max-height:60vh;overflow:auto}
.fld{margin-bottom:13px}
.fld .hint{font-size:11px;color:var(--mu2);margin-top:4px}
.fcats{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.fcat{padding:3px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel3);color:var(--mu);
  font-size:11.5px;cursor:pointer;transition:.12s;user-select:none}
.fcat:hover{border-color:var(--gold-d);color:var(--tx)}
.fcat.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.fcat i{font-style:normal;opacity:.6;margin-left:3px;font-size:10.5px}
.fgridhead{font-size:10.5px;color:var(--mu2);margin-top:11px;letter-spacing:.3px}
.fgridhead b{color:var(--mu);font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px;margin-top:10px;
  max-height:238px;overflow-y:auto;padding:2px 4px 2px 2px;align-content:start}
.fgrid::-webkit-scrollbar{width:6px}
.fgrid::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.fcell{padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel3);cursor:pointer;transition:.12s;min-width:0}
.fcell:hover{border-color:var(--gold-d);background:var(--panel2)}
.fcell.on{border-color:var(--gold);background:var(--panel2)}
.fcell .n{font-size:12.5px;color:var(--tx);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcell .e{font-size:9.5px;color:var(--mu2);font-family:var(--mono);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fempty{padding:14px 4px;color:var(--mu2);font-size:12px;text-align:center;grid-column:1/-1}
.fprev{margin-top:9px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel3);display:none}
.fprev.on{display:block}
.fprev .fptitle{font-size:13px;color:var(--tx);margin-bottom:5px}
.fprev .fpmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:99;
  background:var(--panel2);border:1px solid var(--gold-d);color:var(--tx);padding:11px 20px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 35px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--bad)}
#toast.ok{border-color:var(--ok)}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .mixwrap{grid-template-columns:1fr}
  .reclist{max-height:290px}
  .receiptwrap{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:16px 13px 60px}
  .topbar{padding:10px 13px;gap:10px}
  .brand{order:1;flex:1;min-width:0}
  .brand h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnSettings{order:2}
  .tabs{order:3;margin-left:0;width:100%;overflow-x:auto;justify-content:flex-start}
  .tabs button{padding:6px 12px;font-size:12.5px;flex:1 0 auto}
  .led{grid-template-columns:auto 1fr;row-gap:6px}
  .led .amt{grid-column:2;text-align:left}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat .v{font-size:19px}
  .receipt{width:100%;padding:18px 14px}
  .rrow.g3{grid-template-columns:1fr auto 54px}
}

/* ---------- 打印 ---------- */
@media print{
  @page{margin:5mm}
  body{background:#fff;color:#000}
  body::before{display:none}
  .topbar,.noprint,#toast,.mask{display:none !important}
  main{padding:0;max-width:none}
  .receiptwrap{display:block !important}
  .receipt{
    box-shadow:none;margin:0 auto;width:70mm;padding:5mm 4mm;background:#fff;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  body.print-a4 .receipt{width:150mm}
  .rbarcode{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rrow .k,.rsec,.rfoot,.rstoresub{color:#3a3128}
  .receipt::after{opacity:.15}
}

The Delights (and Dangers) of the Flowing Bowl》中这款历史悠久的火焰潘趣酒为证。","肉豆蔻粉",["1. 调制前几小时，用削皮器或小刀削 4 个柠檬的皮，做成 4 条长螺旋。放入耐热碗中，加 3/4 杯德梅拉拉糖。把果皮与糖一起捣压，室温静置。把 4 个削皮柠檬（以及需要的额外柠檬）经滤网榨汁，得到 6 盎司滤汁，置冰箱备用。","2. 把朗姆与干邑量入大壶或其他倒酒容器。调制时将水烧开，把盛有柠檬皮与糖的碗放在砧板或其他耐热面上，置于开阔处（远离杂物、易燃物、窗帘或灯具），让所有人都能安全地围过来。","3. 把干邑与朗姆倒入碗中。用长柄吧勺舀起一勺朗姆干邑混合液，用火柴点燃，悬在碗面上方引燃其余液体。用吧勺或耐热汤勺搅拌帮助糖溶解。让混合物燃烧 2 到 3 分钟，期间偶尔用勺子挑起一条柠檬皮，展示火焰沿着它窜下。","4. 用大号耐热盘或托盘盖住碗灭火。加入柠檬汁与热水。（想做冷饮的话，用 3 杯冷水替换热水，并加入 1 夸脱的冰块——把一夸脱碗的水冻 24 小时即可。）搅拌。在表面磨新鲜肉豆蔻，按 3 盎司一份舀出。"],15.43,null,null,"Muddle","捣压",["Punch"],["餐酒"],"酸","朗姆","现代",0,1,[[101,295.74,10.0,"oz",0,0,null],[87,295.74,10.0,"oz",0,0,"high-proof Jamaican rum"],[45,236.59,8.0,"oz",0,0,"VSOP"],[1,177.44,6.0,"oz",0,0,null],[145,0,0.75,"cup",0,1,"Demerara"],[154,0,4.0,"whole",0,1,null],[149,946.35,32.0,"oz",0,0,"Boiling, to top"]]],["chauncey","Chauncey","等份的杜松子酒、干邑与黑麦威士忌，加上甜味美思与橙味苦精，构成这款历史悠久的鸡尾酒配方。","柠檬或橙皮 twists",["1. 所有材料加冰倒入调酒杯","2. 搅拌至冷","3. 滤入冰镇鸡尾酒杯","4. 以柠檬或橙皮 twists 装饰。"],28.71,"Cocktail","鸡尾酒杯","Stir","搅拌",[],[],"苦味","金酒","现代",0,1,[[0,22.5,22.5,"ml",0,0,null],[45,22.5,22.5,"ml",0,0,null],[50,22.5,22.5,"ml",0,0,null],[24,22.5,22.5,"ml",0,0,null],[6,1.8,2.0,"dash",0,0,null]]],["chocolate-martica","Chocolate Martica","这是 2007 年 Death & Co 现代经典款的简单变体，是最早使用巧克力苦精……的作品之一。",null,["所有材料加冰搅拌，滤入冰镇杯中。"],27.18,"Coupe","浅碟杯","Stir","搅拌",[],[],"苦味","朗姆","现代",0,1,[[87,30.0,30.0,"ml",0,0,null],[45,30.0,30.0,"ml",0,0,null],[24,30.0,30.0,"ml",0,0,null],[89,7.5,7.5,"ml",0,0,null],[155,1.8,2.0,"dashes",0,0,"Bittermens Xocolatl Mole recommended"]]],["chrysanthemum","Chrysanthemum","名字难拼却好喝，Chrysanthemum 属于那些较少人问津的经典——依然备受好评，却很少被邀去凑热闹。","橙皮 twists",["1. 所有材料在调酒杯中加冰搅拌至冷，滤入冰镇杯中并装饰。","2. Tip「我也会用白味美思试这个，因为那个年代的很多配方，比如 Algonquin、El Presidente 和 Blackthorn，都写的是干味美思——在我看来用白味美思味道更好。」——Meehan"],21.24,"Absinthe","Absinthe","Stir","搅拌",[],[],"经典","葡萄酒","现代",0,1,[[37,60.0,60.0,"ml",0,0,null],[106,30.0,30.0,"ml",0,0,null],[4,2.7,3.0,"dash",0,0,null]]],["ciderhouse-mule","Ciderhouse Mule","Tim Sweeney——纽约市 Pebble Bar 的首 function decodeData(R){
  const fi=R.fi, ii=R.ii, il=R.il, mi=R.mi;
  const ilIdx=fi.indexOf('ings');
  const recipes=R.r.map(a=>{
    const o={};
    for(let i=0;i<fi.length;i++){ if(i!==ilIdx) o[fi[i]]=a[i]; }
    o.ings=(a[ilIdx]||[]).map(x=>{
      // x[0] 是原料全局表索引，后面的才是本配方自己的字段
      const g={}; for(let i=0;i<ii.length;i++) g[ii[i]]=x[i+1];
      const L=R.il_table[x[0]]||[];
      for(let i=0;i<il.length;i++) g[il[i]]=L[i];
      return g;
    });
    return o;
  });
  const ingredients={};
  for(const k in R.m){
    const o={}; const arr=R.m[k];
    for(let i=0;i<mi.length;i++) o[mi[i]]=arr[i];
    ingredients[k]=o;
  }
  return {recipes, ingredients, meta:R.meta||{}};
}

      if(e.stepsEn) rec.stepsEn=e.stepsEn;

function zhOf(n){ return (ING_META[n]&&ING_META[n].zh)||''; }
/** 中文名 → 英文规范名（用于库存键归一，避免同一原料存成两个 key） */
const ZH2EN = (()=>{ const m={}; for(const k in ING_META){ if(ING_META[k].zh) m[ING_META[k].zh]=k; } return m; })();
function canonicalName(n){
  const t=(n||'').trim();
  if(!t) return '';
  if(ING_META[t]) return t;
  return ZH2EN[t] || t;

/* ============================ 库存计算 ============================ */
function stockEntry(name){
  const k=canonicalName(name);
  return db.stock[k] || { name:k, sizeMl:0, price:null, unopened:0, openedMl:0, note:'' };
}
function availMl(name){
  const s = db.stock[canonicalName(name)];
  if(!s) return 0;
  return (s.unopened||0)*(s.sizeMl||0) + (s.openedMl||0);
}
function unitCost(name){
  const s = stockEntry(name);
  if(s.price==null || !s.sizeMl) return null;
  return s.price / s.sizeMl;
}
function stockValue(){
  let v=0, known=true;
  for(const k in db.stock){
    const s=db.stock[k];
    if(s.price==null||!s.sizeMl){ known=false; continue; }
    v += (s.unopened||0)*s.price + (s.openedMl||0)*(s.price/s.sizeMl);
  }
  return {value:v, known};
}
/** 计算一次调制对每个原料的消耗与缺料情况。
 *  可选原料不足时按实际库存扣减（eff），不阻断操作；
 *  必需原料不足则进 missing，阻断保存。 */
function planFor(recipe, servings){
  const lines=[], missing=[];
  for(const i of recipe.ings){
    if(i.nonmetered || !i.ml) continue;
    const need = i.ml * servings;
    const have = availMl(i.n);
    const ok = have >= need;
    if(!ok && !i.opt) missing.push({n:i.n, need, have});
    // 展示用 need（配方需求量），扣减用 eff（实际可扣量）
    // 关键：库存不足时材料行也必须显示 —— 否则用户只看到「缺 60ml」，
    // 根本不知道这杯酒需要什么材料。
    const eff = ok ? need : Math.min(need, have);
    lines.push({n:i.n, ml:need, eff, need, have, ok, opt:!!i.opt});
  }
  return {lines, missing};
}
/** 从库存扣减。line.ml 已是实际应扣量。返回扣减明细（带 before 快照，供撤销还原） */
function deduct(lines){
  const snap=[];
  for(const l of lines){
    const name=canonicalName(l.n), need=(l.eff!=null?l.eff:l.ml);
    if(need<=0) continue;
    if(!db.stock[name]) db.stock[name]={name,sizeMl:0,price:null,unopened:0,openedMl:0,note:''};
    const s=db.stock[name];
    if(s.price==null) s.price = (RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===name)||{}).refPrice ?? null;
    const before={unopened:s.unopened||0, openedMl:s.openedMl||0};
    let remain=need;
    if(s.openedMl>0){ const t=Math.min(s.openedMl,remain); s.openedMl-=t; remain-=t; }
    while(remain>0 && s.unopened>0 && s.sizeMl>0){
      s.unopened--; s.openedMl += s.sizeMl;
      const t=Math.min(s.openedMl,remain); s.openedMl-=t; remain-=t;
    }
    const taken=need-remain;
    snap.push({n:name, ml:taken, before});
    if(remain>0.001) snap[snap.length-1].short=remain;
  }
  return snap;
}
function restore(snap){
  for(const l of snap){
    const s=db.stock[l.n];
    if(!s) continue;
    s.unopened=l.before.unopened; s.openedMl=l.before.openedMl;
  }
}
/** 一杯的总成本（只算有价的原料） */
function costOf(lines){
  let c=0, all=true;
  for(const l of lines){
    const u=unitCost(l.n);
    if(u==null){ all=false; continue; }
    c += u*(l.eff!=null?l.eff:l.ml);
  }
  return {cost:c, complete:all};
}

/* 某个维度的可选值 + 计数（只统计当前其它筛选条件下的） */
function mixFacet(dim){
  const cnt={};
  for(const r of RECIPES){
    if(ui.mixTier==='classic' && r.tier!==1) continue;
    if(ui.mixStyle!=='全部' && dim!=='style' && r.style!==ui.mixStyle) continue;
    if(ui.mixBase!=='全部' && dim!=='base' && r.base!==ui.mixBase) continue;
    if(ui.mixLineage!=='全部' && dim!=='lineage' && r.lineage!==ui.mixLineage) continue;
    cnt[r[dim]]=(cnt[r[dim]]||0)+1;
  }
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
}

/* ============================ 视图：账单 ============================ */
function statementData(m){
  const prev=monthShift(m,-1);
  const ents=db.ledger.filter(e=>eMonth(e)===m);
  const byIng={}, byRec={};
  let cups=0, vol=0, cost=0, unpriced=false, ingCost=0;
  for(const e of ents){
    cups+=e.servings; vol+=e.totalMl||0; cost+=e.cost||0;
    if(!byRec[e.name]) byRec[e.name]={cups:0,cost:0};
    byRec[e.name].cups+=e.servings; byRec[e.name].cost+=e.cost||0;
    for(const l of e.lines||[]){
      if(!byIng[l.n]) byIng[l.n]={ml:0,cost:0,priced:false};
      byIng[l.n].ml+=l.ml;
      const u=unitCost(l.n);
      if(u!=null){ byIng[l.n].cost+=u*l.ml; byIng[l.n].priced=true; ingCost+=u*l.ml; }
      else unpriced=true;
    }
  }
  const ingRows=Object.entries(byIng).sort((a,b)=>b[1].ml-a[1].ml);
  const recRows=Object.entries(byRec).sort((a,b)=>b[1].cups-a[1].cups);
  const prevEnts=db.ledger.filter(e=>eMonth(e)===prev);
  const prevCups=prevEnts.reduce((s,e)=>s+e.servings,0);
  const sv=stockValue();
  const receiptNo='HBL-'+m.replace('-','')+'-'+String(ents.length).padStart(3,'0');
  return {m,prev,ents,byIng,byRec,cups,vol,cost,unpriced,ingCost,ingRows,recRows,prevCups,sv,receiptNo};
}

/* ============================ 交互 ============================ */
function bind(){
  // 标签页
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick=()=>{ view=b.dataset.v; render(); };
  });
  const q=document.getElementById('mixQ');
  if(q){
    q.oninput=()=>{
      ui.mixQ=q.value;
      const pos=q.selectionStart;
      render();
      const nq=document.getElementById('mixQ');
      if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); }
    };
  }
  const en=document.getElementById('showEn');
  if(en) en.onchange=async ()=>{
    ui.showEn=en.checked;
    if(ui.showEn && !enLoaded){
      const ok=await loadEnglish();
      if(!ok){ ui.showEn=false; en.checked=false; toast('离线模式下无法显示英文原文','bad'); }
    }
    render();
  };
  const ss=document.getElementById('stockSort');
  if(ss) ss.onchange=(e)=>{ ui.stockSort=e.target.value; render(); };
  const lm=document.getElementById('ledgerMonth');
  if(lm) lm.onchange=()=>{ ui.ledgerMonth=lm.value; render(); };
  const sm=document.getElementById('stmtMonth');
  if(sm) sm.onchange=()=>{ ui.stmtMonth=sm.value; render(); };
  if(view==='cabinet') renderCanMake();

  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick=(ev)=>{ ev.stopPropagation(); handle(el.dataset.act, el.dataset, el); };
  });
}

function handle(act,d){
  switch(act){
    case 'addstock': return stockForm(null);
    case 'editstock': return stockForm(d.name);
    case 'delstock': return delStock(d.name);
    case 'selrecipe': ui.mixSel=d.id; ui.servings=1; return render();
    case 'serv': ui.servings=+d.n; return render();
    case 'record': return recordDrink(d.id);
    case 'gorecipe': view='mix'; ui.mixSel=d.id; ui.servings=1; ui.mixQ=''; return render();
    case 'undorec': return undoRecord(d.id);
    case 'clearledger': return clearLedger();
    case 'stmtprev': ui.stmtMonth=monthShift(ui.stmtMonth,-1); return render();
    case 'stmtnext': ui.stmtMonth=monthShift(ui.stmtMonth,1); return render();
    case 'print': return doPrint(d.mode);
    case 'copyreceipt': return copyReceipt();
    case 'import': return importData();
    case 'export': return exportData();
    case 'seedbar': return seedBar();
    case 'stockcat': ui.stockCat = d.c; return render();
    case 'mixtier': ui.mixTier = d.t; ui.mixLimit=150; return render();
    case 'mixfilter': ui[d.k]=d.v; ui.mixLimit=150; return render();
    case 'mixclear': ui.mixStyle='全部'; ui.mixBase='全部'; ui.mixLineage='全部'; ui.mixTier='all'; ui.mixLimit=150; return render();
    case 'mixmore': ui.mixLimit+=200; return render();
  }
}

function stockForm(name){
  const s=name?stockEntry(name):{name:'',sizeMl:0,price:null,unopened:0,openedMl:0};
  openModal(name?'编辑原料':'添加原料', `
    <div class="fld">
      <label class="lb">原料名称 <span class="tiny dim">可直接搜，也可从下面的分类里挑</span></label>
      <input class="inp" id="fName" value="${esc(s.name)}" placeholder="输入「金酒」「伏特加」或英文均可" autocomplete="off">
      <div class="hint" style="margin-top:6px">共 ${ING_LIST.length} 种原料 · 点一下就选中，选中后自动带出分类、规格与参考价</div>
      <div class="fcats" id="fCats"></div>
      <div class="fgridhead" id="fGridHead"></div>
      <div class="fgrid" id="fGrid"></div>
      <div class="fprev" id="fPrev"></div>
    </div>
    <div class="row" style="gap:10px">
      <div class="fld sp"><label class="lb">整瓶数</label><input class="inp" id="fUnopened" type="number" min="0" step="1" value="${s.unopened||0}"></div>
      <div class="fld sp"><label class="lb">规格 (ml/瓶)</label><input class="inp" id="fSize" type="number" min="0" step="1" value="${s.sizeMl||''}"></div>
    </div>
    <div class="row" style="gap:10px">
      <div class="fld sp"><label class="lb">已开封余量 (ml)</label><input class="inp" id="fOpened" type="number" min="0" step="1" value="${s.openedMl||0}"></div>
      <div class="fld sp"><label class="lb">整瓶单价</label><input class="inp" id="fPrice" type="number" min="0" step="0.01" value="${s.price!=null?s.price:''}" placeholder="可留空"></div>
    </div>
    <div class="fld"><label class="lb">备注</label><input class="inp" id="fNote" value="${esc(s.note||'')}" placeholder="品牌 / 批次 / 开封日期"></div>
  `, (body,close)=>{
    const nameEl = body.querySelector('#fName');
    const catRow = body.querySelector('#fCats');
    const gridBox = body.querySelector('#fGrid');
    const prevBox = body.querySelector('#fPrev');
    let selCat = '全部';

    function refOf(n){
      return RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===n);
    }
    function applyMeta(n, force){
      const meta = ING_META[n];
      if(!meta) return;
      const ref = refOf(n);
      const sizeEl = body.querySelector('#fSize');
      const priceEl = body.querySelector('#fPrice');
      if(ref && ref.refSize && (force || !sizeEl.value)) sizeEl.value = ref.refSize;
      if(ref && ref.refPrice!=null && (force || !priceEl.value)) priceEl.value = ref.refPrice;
      // 预览
      if(prevBox){
        prevBox.classList.add('on');
        prevBox.innerHTML = '<div class="fptitle">'+esc(meta.z||n)
          + (meta.z ? ' <span class="tiny dim">'+esc(n)+'</span>' : '')
          + '</div>'
          + '<div class="fpmeta">'
          + '<span class="pill">'+esc(meta.catTopZh||meta.cat||'其他')+'</span>'
          + (meta.abv?'<span class="pill">'+meta.abv+'% ABV</span>':'')
          + (ref&&ref.refSize?'<span class="pill">标准规格 '+ref.refSize+'ml</span>':'')
          + (ref&&ref.refPrice!=null?'<span class="pill gold">参考价 '+db.settings.currency+ref.refPrice+'</span>':'<span class="pill">参考价未收录</span>')
          + '</div>';
      }
    }
    // 分类列表：按原料数降序，「全部」排最前
    const CAT_ORDER = ['全部'];
    const catCount = {};
    for(const x of ING_LIST) catCount[x.cat] = (catCount[x.cat]||0)+1;
    const cats = Object.keys(catCount).sort((a,b)=>catCount[b]-catCount[a]);
    CAT_ORDER.push(...cats);
    catRow.innerHTML = CAT_ORDER.map(c =>
      '<button class="fcat'+(c===selCat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)
      + (c==='全部' ? '' : '<i>'+catCount[c]+'</i>') + '</button>'
    ).join('');
    catRow.querySelectorAll('.fcat').forEach(b=>{
      b.onclick=()=>{
        selCat = b.dataset.c;
        catRow.querySelectorAll('.fcat').forEach(x=>x.classList.toggle('on', x===b));
        nameEl.value = '';        // 切分类时清掉搜索词，网格含义才明确
        renderGrid();
      };
    });

    function currentList(){
      const q = nameEl.value.trim().toLowerCase();
      if(q) return ING_LIST.filter(x =>
        x.n.toLowerCase().includes(q) || (x.z && x.z.toLowerCase().includes(q)));
      if(selCat==='全部') return ING_LIST;
      return ING_LIST.filter(x => x.cat === selCat);
    }
    function renderGrid(){
      const q = nameEl.value.trim();
      const list = currentList();
      const head = body.querySelector('#fGridHead');
      head.innerHTML = q
        ? '搜索「<b>'+esc(q)+'</b>」 · '+list.length+' 种'
        : '<b>'+esc(selCat)+'</b> · '+list.length+' 种';
      if(!list.length){
        gridBox.innerHTML = '<div class="fempty">没找到「'+esc(q)+'」，可直接保存为自定义原料</div>';
        return;
      }
      gridBox.innerHTML = list.map(x =>
        '<button class="fcell" data-n="'+esc(x.n)+'" title="'+esc(x.n)+'">'
        + '<div class="n">'+esc(x.z||x.n)+'</div>'
        + (x.z ? '<div class="e">'+esc(x.n)+'</div>' : '')
        + '</button>').join('');
      gridBox.querySelectorAll('.fcell').forEach(el=>{
        el.onclick=()=>{ pick(el.dataset.n); };
      });
    }
    function pick(n){
      if(!n) return;
      nameEl.value = n;
      applyMeta(n, true);
      gridBox.querySelectorAll('.fcell').forEach(el=>el.classList.toggle('on', el.dataset.n===n));
    }
    nameEl.addEventListener('input', ()=>{
      renderGrid();
      const n = canonicalName(nameEl.value.trim());
      if(n && ING_META[n]) applyMeta(n, false);
      else prevBox.classList.remove('on');
    });
    nameEl.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const n = canonicalName(nameEl.value.trim());
        if(n && ING_META[n]){ nameEl.value = n; applyMeta(n, true); }
      }
    });
    nameEl.onchange=(e)=>{
      const n=canonicalName(e.target.value.trim());
      if(n!==e.target.value.trim()) e.target.value=n;
      if(n && ING_META[n]) applyMeta(n, false);
      else prevBox.classList.remove('on');
    };
    renderGrid();
    if(s.name && ING_META[s.name]){
      applyMeta(s.name, false);
      gridBox.querySelectorAll('.fcell').forEach(el=>el.classList.toggle('on', el.dataset.n===s.name));
    }
    body.querySelector('#mSave').onclick=()=>{
      const raw=body.querySelector('#fName').value.trim();
      if(!raw){ toast('原料名不能为空','bad'); return; }
      const n=canonicalName(raw);
      const unopened=Math.max(0,+body.querySelector('#fUnopened').value||0);
      const sizeMl=Math.max(0,+body.querySelector('#fSize').value||0);
      const openedMl=Math.max(0,+body.querySelector('#fOpened').value||0);
      const pv=body.querySelector('#fPrice').value;
      db.stock[n]={name:n,sizeMl,price:(pv===''?null:+pv),unopened,openedMl,note:body.querySelector('#fNote').value.trim()};
      save(); close(); render(); toast(n+' 已入库','ok');
    };
    const del=body.querySelector('#delStock');
    if(del) del.onclick=()=>{ close(); delStock(name); };
  }, {extraFooter: name?`<button class="btn danger" id="delStock">删除</button>`:''});
}

function delStock(name){
  const used=db.ledger.filter(e=>(e.lines||[]).some(l=>l.n===name)).length;
  confirmModal('从酒柜移除？',
    `「${name}」将被删除${used?`，历史台账里有 ${used} 条记录引用它（不受影响）`:''}。`, ()=>{

const STARTER_BAR = [

  let n=0;

/* --- 记录一杯 --- */
function recordDrink(id){
  const r=BY_ID[id]; if(!r) return;
  const plan=planFor(r, ui.servings);
  if(plan.missing.length){ toast('还缺：'+plan.missing.map(m=>m.n).join('、'),'bad'); return; }
  const snap=deduct(plan.lines);
  const totalMl=plan.lines.reduce((s,l)=>s+l.ml,0);
  const c=costOf(plan.lines);
  const seq=(db.ledger.reduce((mx,e)=>Math.max(mx,e.seq||0),0))+1;
  db.ledger.push({
    id:'e'+Date.now()+Math.random().toString(36).slice(2,7),
    seq, ts:Date.now(), recipeId:r.id, name:r.name, servings:ui.servings,
    lines:snap, totalMl, cost:c.cost, complete:c.complete
  });
  save(); render();
  toast('记下了 '+ui.servings+' 杯 '+r.name,'ok');
}

/* --- 撤销 --- */
function undoRecord(id){
  const e=db.ledger.find(x=>x.id===id); if(!e) return;
  confirmModal('撤销这条记录？', `「${e.name}」用掉的原料会退回酒柜。`, ()=>{
    restore(e.lines||[]);
    db.ledger=db.ledger.filter(x=>x.id!==id);
    save(); render(); toast('已撤销，原料已退回','ok');
  });
}

/* --- 清空 --- */
function clearLedger(){
  if(!db.ledger.length){ toast('台账本来就是空的'); return; }
  confirmModal('清空整个台账？', `${db.ledger.length} 条记录会被删除。此操作不可撤销，库存不会被自动退回。`, ()=>{
    db.ledger=[]; save(); render(); toast('台账已清空');
  });
}

/* --- 导入导出 --- */
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='home-bar-ledger-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('备份已导出','ok');
}
function importData(){
  openModal('导入备份','<div class="fld"><label class="lb">选择 .json 文件</label><input class="inp" type="file" id="fFile" accept="application/json"></div><div class="hint">导入会覆盖当前全部数据</div>',(body,close)=>{
    body.querySelector('#fFile').onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const d=JSON.parse(rd.result);
          if(!d.stock||!d.ledger) throw new Error('格式不对');
          db=Object.assign(defaults(),d,{settings:Object.assign(defaults().settings,d.settings||{})});
          save(); close(); render(); toast('导入成功','ok');
        }catch(err){ toast('导入失败：'+err.message,'bad'); }
      };
      rd.readAsText(f);
    };
  }, {extraFooter:'', hideSave:true});
}
function doPrint(mode){
  document.body.classList.toggle('print-a4', mode==='a4');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-a4'),500);
}
function copyReceipt(){
  const m=ui.stmtMonth;
  const ents=db.ledger.filter(e=>eMonth(e)===m);
  const byIng={},byRec={};
  let cups=0,vol=0,cost=0;
  for(const e of ents){
    cups+=e.servings; vol+=e.totalMl||0; cost+=e.cost||0;
    byRec[e.name]=(byRec[e.name]||0)+e.servings;
    for(const l of e.lines||[]) byIng[l.n]=(byIng[l.n]||0)+l.ml;
  }
  const L=[];
  L.push('◑ '+db.settings.barName+' — '+monthLabel(m)+' 结算单');
  L.push('─'.repeat(28));
  L.push('出品：');
  for(const [n,c] of Object.entries(byRec)) L.push('  '+n+' ×'+c);
  L.push('原料消耗：');
  for(const [n,v] of Object.entries(byIng).sort((a,b)=>b[1]-a[1])) L.push('  '+n+'  '+v.toFixed(0)+'ml');
  L.push('─'.repeat(28));
  L.push('总杯数 '+cups+' 杯 / 原料 '+Math.round(vol)+'ml');
  L.push('原料成本 '+money(cost));
  L.push('谢谢惠顾');
  const text=L.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('账单文本已复制','ok'),()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('账单文本已复制','ok'); }
  catch(e){ toast('复制失败，请手动选择','bad'); }
  ta.remove();
}

/* --- 弹窗 --- */
function openModal(title, bodyHTML, onMount, opts){
  opts=opts||{};
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal${opts.wide?' wide':''}">
    <header><h3>${title}</h3><button class="iconbtn" id="mClose">✕</button></header>
    <div class="body">${bodyHTML}</div>
    <footer>${opts.extraFooter||''}<button class="btn" id="mCancel">取消</button>${opts.hideSave?'':'<button class="btn gold" id="mSave">保存</button>'}</footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mClose').onclick=close;
  document.getElementById('mCancel').onclick=close;
  const ms=document.getElementById('mSave'); if(ms) ms.onclick=close;
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
  if(onMount) onMount(host.querySelector('.modal'),close);
}
function confirmModal(title,msg,onYes){
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal" style="max-width:400px">
    <header><h3>${title}</h3></header>
    <div class="body"><div style="color:var(--mu);font-size:13.5px">${msg}</div></div>
    <footer><button class="btn" id="mNo">取消</button><button class="btn gold" id="mYes">确定</button></footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mNo').onclick=close;
  document.getElementById('mYes').onclick=()=>{ close(); onYes(); };
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
}

      b.onclick=()=>{
        st.theme=b.dataset.themePick;

        applyTheme(); save_();
      };
    });

    /* ---- 滑块 ---- */
    const bop=body.querySelector('#sBgOpacity');

    const bsz=body.querySelector('#sBgSize');

    const op=body.querySelector('#sOpacity');
    op.oninput=()=>{ body.querySelector('#sOpVal').textContent=op.value+'%'; st.receipt.bgOpacity=op.value/100; refreshPreview(); save_(); };

    /* ---- 小票纸张 ---- */
    body.querySelectorAll('.pchoice').forEach(b=>{
      b.onclick=()=>{
        st.receipt.paper=b.dataset.p;
        body.querySelectorAll('.pchoice').forEach(x=>x.classList.toggle('on',x===b));
        refreshPreview(); save_();
      };
    });

    /* ---- 小票文本 ---- */
    const bindText=(id,fn)=>{ const el=body.querySelector('#'+id); if(el) el.addEventListener('input',()=>{ fn(el.value); refreshPreview(); save_(); }); };
    const bindRaw=(id,fn)=>{ const el=body.querySelector('#'+id); if(el) el.addEventListener('input',()=>{ fn(el.value); save_(); }); };

    bindRaw('sOwner', v=>{ st.owner=v; });
    bindRaw('sCur', v=>{ st.currency=v||'¥'; });
    bindText('sNote', v=>st.receipt.note=v);
    bindText('sFoot', v=>st.receipt.foot=v);
    bindText('sFoot2', v=>st.receipt.foot2=v);

    /* ---- 背景图 ---- */
    const bg=body.querySelector('#sBg');
    if(bg) bg.onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=420, sc=Math.min(1, max/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          st.receipt.bgImage=cv.toDataURL('image/jpeg',.7);
          save_(); refreshPreview(); toast('背景图已保存','ok');
        };
        img.src=fr.result;
      };
      fr.readAsDataURL(f);
    };
    const bc=body.querySelector('#sBgClear');
    if(bc) bc.onclick=()=>{ st.receipt.bgImage=null; save_(); refreshPreview(); toast('已清除背景图'); };

    /* ---- 实时预览 ---- */
    const preview=body.querySelector('#setPreview');
    function refreshPreview(){
      if(!preview) return;
      preview.innerHTML=receiptHTML(statementData(ui.stmtMonth));
    }
    refreshPreview();

    /* ---- 数据区按钮 ---- */
    body.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick=(ev)=>{
        ev.stopPropagation();
        const a=b.dataset.act;
        if(a==='export') exportData();
        else if(a==='import') importData();
        else if(a==='wipe') confirmModal('清空全部数据？','酒柜、全部台账记录与设置都会被删除，无法撤销。建议先导出备份。',()=>{
          localStorage.removeItem('hbl.v1'); db=defaults(); save(); close(); render(); toast('已清空全部数据');
        });
      };
    });
  }, {wide:true});
}
document.getElementById('btnSettings').onclick=openSettings;

/* ============================ 启动 ============================ */
render();
</script>

    font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700;border:2px solid #1d1712}
  .fb-panel{position:fixed;right:16px;bottom:72px;width:340px;max-height:72vh;background:#1d1712;border:1px solid #3a2f24;
    border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.55);display:none;flex-direction:column;overflow:hidden;z-index:9998}
  .fb-panel.open{display:flex}
  .fb-head{padding:12px 14px;border-bottom:1px solid #3a2f24;display:flex;justify-content:space-between;align-items:center}
  .fb-head b{font-size:13.5px;color:#ece3d5}
  .fb-head span{font-size:11px;color:#a08d75}
  .fb-body{padding:12px 14px;overflow-y:auto;flex:1}
  .fb-item{border:1px solid #3a2f24;border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#241d17}
  .fb-item .fb-t{font-size:12.5px;color:#ece3d5;margin-bottom:4px;word-break:break-word}
  .fb-item .fb-s{font-size:10.5px;color:#7d6c58;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
  .fb-item .fb-m{display:flex;gap:6px;margin-top:6px;align-items:center}
  .fb-pill{font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid #4a3b2c;color:#a08d75}
  .fb-pill.p1{color:#d9a441;border-color:#8a6420}
  .fb-pill.p2{color:#c0553f;border-color:#c0553f}
  .fb-pill.ok{color:#7fa35c;border-color:#7fa35c}
  .fb-empty{color:#7d6c58;font-size:12px;text-align:center;padding:18px 8px}
  .fb-pop{position:fixed;z-index:10000;width:300px;background:#1d1712;border:1px solid #d9a441;border-radius:10px;
    box-shadow:0 16px 50px rgba(0,0,0,.6);padding:12px;display:none}
  .fb-pop.open{display:block}
  .fb-pop textarea{width:100%;min-height:74px;background:#16110d;border:1px solid #3a2f24;border-radius:7px;color:#ece3d5;
    padding:8px;font:12.5px/1.5 inherit;resize:vertical;outline:none;box-sizing:border-box}
  .fb-pop textarea:focus{border-color:#8a6420}
  .fb-pop .fb-sel{font-size:10.5px;color:#a08d75;margin-bottom:7px;font-family:ui-monospace,Menlo,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fb-row{display:flex;gap:6px;margin-top:9px;align-items:center}
  .fb-btn2{padding:5px 11px;border-radius:6px;border:1px solid #4a3b2c;background:#241d17;color:#ece3d5;font-size:12px;cursor:pointer}
  .fb-btn2:hover{border-color:#d9a441}
  .fb-btn2.pri{font-size:11px}
  .fb-btn2.pri.on{background:#8a6420;border-color:#d9a441;color:#f5e6c8}
  .fb-btn2.send{background:#d9a441;color:#1a1409;border-color:#d9a441;font-weight:600}
  .fb-hl{outline:2px solid #d9a441 !important;outline-offset:2px !important;cursor:crosshair !important}
  .fb-toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:#1d1712;border:1px solid #7fa35c;color:#ece3d5;
    padding:9px 18px;border-radius:8px;font-size:13px;z-index:10001;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .fb-toast.open{display:block}
  .fb-hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#d9a441;color:#1a1409;padding:6px 16px;
    border-radius:20px;font-size:12.5px;font-weight:600;z-index:10001;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .fb-hint.open{display:block}
  `;

  const st = document.createElement('style');
  st.textContent = CSS;
  document.head.appendChild(st);

  const root = document.createElement('div');
  root.className = 'fb-root';
  root.innerHTML = `<button class="fb-btn" title="反馈模式 (F)">✎</button>`;
  document.body.appendChild(root);

  const panel = document.createElement('div');
  panel.className = 'fb-panel';
  panel.innerHTML = `
    <div class="fb-head">
      <b>反馈</b>
      <span style="display:flex;align-items:center;gap:8px">
        <span id="fb-count">0 条待处理</span>
        <button class="fb-btn2" id="fb-exit" title="退出反馈模式 (F)">退出</button>
      </span>
    </div>
    <div id="fb-links" style="padding:8px 14px 0"></div>
    <div style="padding:8px 14px 0;font-size:10.5px;color:#7d6c58;line-height:1.6">
      提交后 agent 会逐条处理：修好会打「已修复」标签 + 关闭，并附上对应 commit。已处理的不会重复出现。
    </div>
    <div class="fb-body" id="fb-list"></div>
    <div style="padding:9px 14px;border-top:1px solid #3a2f24;display:flex;gap:6px;flex-wrap:wrap">
      <button class="fb-btn2" id="fb-copy">复制全部反馈</button>
      <button class="fb-btn2" id="fb-copy-last">复制最新一条</button>
      <div style="flex:1"></div>
      <button class="fb-btn2" id="fb-clear">清空</button>
    </div>`;
  document.body.appendChild(panel);

  const pop = document.createElement('div');
  pop.className = 'fb-pop';
  pop.innerHTML = `
    <div class="fb-sel" id="fb-sel">—</div>
    <textarea id="fb-note" placeholder="这里哪里不对？想要什么？"></textarea>
    <div class="fb-row">
      <button class="fb-btn2 pri" data-p="3">细节</button>
      <button class="fb-btn2 pri" data-p="2">一般</button>
      <button class="fb-btn2 pri" data-p="1">必改</button>
      <div style="flex:1"></div>
      <button class="fb-btn2" id="fb-cancel">取消</button>
      <button class="fb-btn2 send" id="fb-send">提交</button>
    </div>`;
  document.body.appendChild(pop);

  const toast = document.createElement('div');
  toast.className = 'fb-toast';
  document.body.appendChild(toast);

  const hint = document.createElement('div');
  hint.className = 'fb-hint';
  hint.textContent = '反馈模式：点击页面上的任意元素来标注 · 再按 F 退出';
  document.body.appendChild(hint);

  const btn = root.querySelector('.fb-btn');
  let mode = false;
  let items = [];
  let sel = null;      // {el, path, text, tag}
  let pri = 2;

  /* ---------- 工具 ---------- */
  function cssPath(el) {
    const parts = [];
    while (el && el.nodeType === 1 && el !== document.body) {
      let p = el.tagName.toLowerCase();
      if (el.id) { parts.unshift(p + '#' + el.id); break; }
      const cls = (el.className && typeof el.className === 'string')
        ? el.className.split(/\s+/).filter(c => c && !c.startsWith('fb-')).slice(0, 2) : [];
      if (cls.length) p += '.' + cls.join('.');
      const par = el.parentElement;
      if (par) {
        const sibs = [...par.children].filter(c => c.tagName === el.tagName);
        if (sibs.length > 1) p += ':nth-of-type(' + (sibs.indexOf(el) + 1) + ')';
      }
      parts.unshift(p);
      el = par;
    }
    return parts.join(' > ');
  }
  function txt(el) {
    return (el.innerText || el.textContent || '').trim().slice(0, 80).replace(/\s+/g, ' ');
  }
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add('open');
    setTimeout(() => toast.classList.remove('open'), 2200);
  }

  /* ---------- 反馈列表 ---------- */
  function renderList() {
    const open = items.filter(i => i.status === 'open');
    document.getElementById('fb-count').textContent = open.length + ' 条待处理';
    let badge = root.querySelector('.fb-badge');
    if (open.length) {
      if (!badge) { badge = document.createElement('span'); badge.className = 'fb-badge'; root.appendChild(badge); }
      badge.textContent = open.length;
    } else if (badge) badge.remove();

    const box = document.getElementById('fb-list');
    if (!items.length) { box.innerHTML = '<div class="fb-empty">还没有反馈<br>点右下角按钮开始标注</div>'; return; }
    box.innerHTML = items.slice().reverse().map(i => `
      <div class="fb-item" data-id="${i.id}">
        <div class="fb-t">${escapeHtml(i.note || '(无文字)')}</div>
        <div class="fb-s">${escapeHtml(i.selText || '')}</div>
        <div class="fb-s" style="opacity:.7">${escapeHtml(i.selector || '')}</div>
        <div class="fb-m">
          <span class="fb-pill ${i.priority === 1 ? 'p2' : i.priority === 3 ? 'ok' : 'p1'}">${priName(i.priority)}</span>
          <span class="fb-pill">${escapeHtml(i.view || '')}</span>
          <div style="flex:1"></div>
          <button class="fb-btn2" data-act="done" data-id="${i.id}">标记已改</button>
        </div>
      </div>`).join('');
    box.querySelectorAll('[data-act="done"]').forEach(b => b.onclick = () => {
      const it = items.find(x => x.id === b.dataset.id);
      if (it) { it.status = 'done'; saveLocal(); renderList(); say('已标记为「已改」'); }
    });
  }
  function priName(p) { return p === 1 ? '必改' : p === 3 ? '细节' : '一般'; }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- 本地缓存（离线也能看到） ---------- */
  function saveLocal() { try { localStorage.setItem('fb.items', JSON.stringify(items)); } catch (e) { } }
  function loadLocal() { try { return JSON.parse(localStorage.getItem('fb.items') || '[]'); } catch (e) { return []; } }

  /* ---------- 模式切换 ---------- */
  function setMode(on) {
    mode = on;
    btn.classList.toggle('on', on);
    panel.classList.toggle('open', on);
    hint.classList.toggle('open', on);
    if (!on) { sel = null; pop.classList.remove('open'); clearHl(); }
  }
  let hl = null;
  function clearHl() { if (hl) { hl.classList.remove('fb-hl'); hl = null; } }

  document.addEventListener('mouseover', e => {
    if (!mode) return;
    if (e.target.closest('.fb-root,.fb-panel,.fb-pop,.fb-hint,.fb-toast')) return;
    if (hl && hl !== e.target) hl.classList.remove('fb-hl');
    hl = e.target;
    hl.classList.add('fb-hl');
  }, true);

  document.addEventListener('click', e => {
    if (!mode) return;
    if (e.target.closest('.fb-root,.fb-panel,.fb-pop,.fb-toast')) return;
    e.preventDefault();
    e.stopPropagation();
    const el = e.target;
    sel = { el, path: cssPath(el), text: txt(el), tag: el.tagName.toLowerCase() };
    document.getElementById('fb-sel').textContent = sel.path;
    document.getElementById('fb-note').value = '';
    const r = el.getBoundingClientRect();
    pop.classList.add('open');
    const w = 300, h = pop.offsetHeight || 200;
    let x = r.left + r.width / 2 - w / 2;
    let y = r.top - h - 12;
    if (y < 70) y = r.bottom + 12;
    x = Math.max(10, Math.min(x, window.innerWidth - w - 10));
    y = Math.max(70, Math.min(y, window.innerHeight - h - 10));
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    setTimeout(() => document.getElementById('fb-note').focus(), 30);
  }, true);

  /* ---------- 优先级 ---------- */
  pop.querySelectorAll('.pri').forEach(b => b.onclick = () => {
    pop.querySelectorAll('.pri').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    pri = +b.dataset.p;
  });
  pop.querySelector('.pri[data-p="2"]').classList.add('on');

  document.getElementById('fb-cancel').onclick = () => { pop.classList.remove('open'); sel = null; };

  // 反馈出口：优先 POST 到 dev server；配置了 repo 时可改为开 GitHub Issue
  const qs = new URLSearchParams(location.search);
  // ⚠️ repo 是异步解析的，不能在这里固化 —— 必须在点击时实时读取
  function ghBase() {
    const repo = window.__FB_REPO_RESOLVED__ || '';
    return repo ? 'https://github.com/' + repo + '/issues/new' : '';
  }

  document.getElementById('fb-send').onclick = async () => {
    if (!sel) return;
    const picked = sel;              // 先留住，sel 马上要清空
    const note = document.getElementById('fb-note').value.trim();
    const item = {
      note,
      priority: pri,
      selector: picked.path,
      selText: picked.text,
      view: currentView(),
      url: location.href,
      viewport: { w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio },
      ts: Date.now(),
      status: 'open',
    };
    items.push(item);
    saveLocal();
    renderList();
    pop.classList.remove('open');
    sel = null;

    // ---- 组装 GitHub Issue（全部同步完成）----
    const GH = ghBase();
    let issueUrl = '';
    if (GH) {
      const body = [
        '### ' + (note || '(无文字描述)'),
        '',
        '| 字段 | 值 |',
        '| --- | --- |',
        '| 优先级 | ' + priName(pri) + ' |',
        '| 视图 | ' + currentView() + ' |',
        '| 元素文本 | ' + (picked.text || '') + ' |',
        '| CSS 选择器 | `' + picked.path + '` |',
        '| 视口 | ' + window.innerWidth + '×' + window.innerHeight + ' |',
        '',
        '<!-- 由应用内反馈组件自动生成 -->',
      ].join('\n');
      issueUrl = GH + '?title=' + encodeURIComponent('[反馈] ' + (picked.text || '未命名元素').slice(0, 40) + ' — ' + (note || '').slice(0, 60))
        + '&body=' + encodeURIComponent(body);
    }

    // ⚠️ 必须同步用 <a> 触发：用户手势一旦跨过 await 就会失效，弹窗会被拦截
    let blocked = false;
    if (issueUrl) {
      try {
        const w = window.open(issueUrl, '_blank');
        blocked = !w;
      } catch (e) { blocked = true; }
    }

    if (window.__FB_DEV__ && typeof fetch === 'function') {
      try {
        await fetch('/__feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
      } catch (e) { /* 本地已存 */ }
    }

    if (blocked) say('浏览器拦截了新窗口 —— 请允许弹出窗口，或用「复制最新一条」发给我');
    else if (issueUrl) say('已开 GitHub Issue，确认后 agent 就能收到 · 按 F 可继续操作应用');
    else say('已提交，反馈已送到 agent · 按 F 可继续操作应用');
  };

  function toText(it) {
    return [
      '优先级: ' + priName(it.priority) + ' | 视图: ' + (it.view || '?'),
      '意见  : ' + (it.note || '(无文字)'),
      '元素  : ' + (it.selText || ''),
      '选择器: ' + (it.sel || it.selector || ''),
      '视口  : ' + (it.viewport ? it.viewport.w + '×' + it.viewport.h : ''),
      '时间  : ' + new Date(it.ts || Date.now()).toLocaleString('zh-CN'),
    ].join('\n');
  }
  async function copyText(txt) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(txt);
      } else {
        const ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      say('已复制，粘贴给 agent 即可');
    } catch (e) { say('复制失败，请手动选中'); }
  }
  document.getElementById('fb-copy').onclick = () => {
    if (!items.length) { say('还没有反馈'); return; }
    copyText('【家庭调酒台账 · 反馈 ' + items.length + ' 条】\n\n' +
      items.map((it, i) => '--- #' + (i + 1) + ' ---\n' + toText(it)).join('\n\n'));
  };
  document.getElementById('fb-copy-last').onclick = () => {
    if (!items.length) { say('还没有反馈'); return; }
    copyText(toText(items[items.length - 1]));
  };
  document.getElementById('fb-clear').onclick = () => {
    items = []; saveLocal(); renderList(); say('已清空本地列表');
  };

  function currentView() {
    const on = document.querySelector('#tabs button.on');
    return on ? on.dataset.v : 'unknown';
  }

  btn.onclick = () => setMode(!mode);
  const exitBtn = document.getElementById('fb-exit');
  if (exitBtn) exitBtn.onclick = () => { setMode(false); say('已退出反馈模式，可以继续操作应用了'); };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { pop.classList.remove('open'); sel = null; }
    if ((e.key === 'f' || e.key === 'F') && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); setMode(!mode);
    }
  });

  function renderLinks(repo) {
    const box = document.getElementById('fb-links');
    if (!box) return;
    if (!repo) { box.style.display = 'none'; return; }
    const q = encodeURIComponent('is:issue in:title "[反馈]"');
    box.innerHTML = '<a class="fb-btn2" style="display:inline-block;text-decoration:none" target="_blank" '
      + 'href="https://github.com/' + repo + '/issues?q=' + q + '">查看全部反馈 Issue</a>';
  }

  /* ---------- 初始加载 ---------- */
  items = loadLocal();
  renderList();
  (async () => {
    const qs2 = new URLSearchParams(location.search);
    let repo = qs2.get('repo') || (window.__FB_REPO__ || '');
    if (!repo && location.protocol !== 'file:' && typeof fetch === 'function') {
      try {
        const r = await fetch('version.json', { cache: 'no-store' });
        if (r.ok) { const v = await r.json(); if (v && v.repo) repo = v.repo; }
      } catch (e) { }
    }
    window.__FB_REPO_RESOLVED__ = repo;
    renderLinks(repo);
    // repo 解析完成后刷新发送逻辑的判断
    window.__FB_REPO_READY__ = true;
  })();
  if (window.__FB_DEV__ && typeof fetch === 'function') fetch('/__feedback').then(r => r.json()).then(list => {
    if (Array.isArray(list) && list.length) {
      const merged = [...items];
      for (const it of list) if (!merged.some(x => x.id === it.id)) merged.push(it);
      items = merged;
      saveLocal();
      renderList();
    }
  }).catch(() => { });
})();
</script>
</body>
</html>
