name: 维持 Issue 互动限制

# GitHub 的 interaction-limits 会在 24 小时后过期，过期后任何人都能提 Issue。
# 这个 workflow 每天自动续期一次。
#
# 凭据优先级：GITHUB_TOKEN → 仓库 secret RENEW_TOKEN
# （GITHUB_TOKEN 的 permissions 白名单里没有 administration 键，不能写在
#  permissions: 里——写了会导致整个 workflow 文件被 GitHub 判为无效）
on:
  push:
    branches: [main]
    paths: ['.github/workflows/renew-interaction-limit.yml']
  schedule:
    - cron: '17 3 * * *'     # 每天 03:17 UTC
  workflow_dispatch:          # 也可手动触发

jobs:
  renew:
    name: 续期「仅协作者可创建 Issue」
    runs-on: ubuntu-latest
    steps:
      - name: 应用限制
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENEW_TOKEN: ${{ secrets.RENEW_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          apply() {
            local tok="$1"
            curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $tok" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/interaction-limits" \
              -d '{"limit":"collaborators_only"}' || echo 000
          }

          CODE=$(apply "$GH_TOKEN")
          WHO="GITHUB_TOKEN"
          if [ "$CODE" != "200" ] && [ -n "${RENEW_TOKEN:-}" ]; then
            CODE=$(apply "$RENEW_TOKEN")
            WHO="RENEW_TOKEN"
          fi

          echo "使用凭据: $WHO · HTTP $CODE"
          cat /tmp/resp.json 2>/dev/null; echo

          if [ "$CODE" != "200" ]; then
            echo "::error::续期失败，仓库的 Issue 限制将在 24 小时后失效。"
            echo "::error::如需修复，请在仓库 Settings → Secrets → Actions 添加 RENEW_TOKEN（一个带 administration 写权限、仅限本仓库的 fine-grained PAT）。"
            exit 1
          fi

          LIMIT=$(python3 -c "import json;print(json.load(open('/tmp/resp.json')).get('limit',''))" 2>/dev/null || echo '')
          if [ "$LIMIT" != "collaborators_only" ]; then
            echo "::error::返回的 limit 不符合预期: ${LIMIT:-空}"
            exit 1
          fi
          echo "✅ 已续期，仅协作者可创建 Issue"
