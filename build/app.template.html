<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家庭调酒台账 · Home Bar Ledger</title>
<style>
:root{
  --bg:#14100d; --panel:#1d1712; --panel2:#241d17; --line:#3a2f24; --line2:#4a3b2c;
  --tx:#ece3d5; --mu:#a08d75; --mu2:#7d6c58;
  --gold:#d9a441; --gold-d:#8a6420; --ok:#7fa35c; --warn:#d38b3a; --bad:#c0553f;
  --paper:#f6f1e4; --ink:#2b2620;
  --r:10px; --mono:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); min-height:100vh;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background:radial-gradient(900px 500px at 15% -5%, rgba(217,164,65,.09), transparent 60%),
             radial-gradient(700px 500px at 95% 105%, rgba(127,163,92,.07), transparent 60%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--gold)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px;
  padding:12px 20px; background:rgba(20,16,13,.88); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--gold),var(--gold-d)); color:#1a1409;
  font-size:19px; font-weight:700; box-shadow:0 3px 12px rgba(217,164,65,.25);
}
.brand h1{margin:0;font-size:15px;letter-spacing:.5px;font-weight:650}
.brand p{margin:0;font-size:9.5px;letter-spacing:2.6px;color:var(--mu2);font-family:var(--mono)}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel);padding:4px;border-radius:var(--r);border:1px solid var(--line)}
.tabs button{
  padding:7px 16px;border-radius:7px;font-size:13.5px;color:var(--mu);
  transition:.15s; white-space:nowrap;
}
.tabs button:hover{color:var(--tx);background:var(--panel2)}
.tabs button.on{background:var(--gold);color:#1a1409;font-weight:600}
.iconbtn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);color:var(--mu);
  display:grid;place-items:center;font-size:15px;transition:.15s;
}
.iconbtn:hover{color:var(--gold);border-color:var(--line2);background:var(--panel)}

main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 20px 70px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 通用块 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin:0 0 3px;font-size:14px;font-weight:600;letter-spacing:.3px}
.card .sub{color:var(--mu2);font-size:11.5px;margin-bottom:14px;letter-spacing:.2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sp{flex:1}

.btn{
  padding:8px 15px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--tx);font-size:13px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--gold-d);background:#2b2219}
.btn.gold{background:var(--gold);color:#1a1409;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#e8b556}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.inp{
  width:100%;padding:8px 11px;background:#16110d;border:1px solid var(--line);
  border-radius:8px;font-size:13.5px;outline:none;transition:.15s;
}
.inp:focus{border-color:var(--gold-d);background:#1a1410}
label.lb{display:block;font-size:11px;color:var(--mu);margin-bottom:5px;letter-spacing:.4px}
.empty{text-align:center;color:var(--mu2);padding:38px 16px;font-size:13px}
.empty b{display:block;color:var(--mu);font-size:14px;margin-bottom:6px;font-weight:500}

.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--mu)}
.pill.ok{color:var(--ok);border-color:rgba(127,163,92,.4)}
.pill.warn{color:var(--warn);border-color:rgba(211,139,58,.4)}
.pill.bad{color:var(--bad);border-color:rgba(192,85,63,.45)}
.pill.gold{color:var(--gold);border-color:rgba(217,164,65,.4)}
.mono{font-family:var(--mono)}
.dim{color:var(--mu)}
.tiny{font-size:11.5px}

/* ---------- 统计条 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .k{font-size:10.5px;color:var(--mu2);letter-spacing:1.3px;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:600;margin-top:3px;font-family:var(--mono);letter-spacing:-.5px}
.stat .v small{font-size:12px;color:var(--mu);font-weight:400}

/* ---------- 酒柜 ---------- */
.stocklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px}
.stockcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;position:relative;transition:.15s}
.stockcard:hover{border-color:var(--line2)}
.stockcard .nm{font-weight:600;font-size:13.5px;margin-bottom:2px;padding-right:52px}
.stockcard .cat{font-size:10.5px;color:var(--mu2);letter-spacing:.6px;text-transform:uppercase}
.bar{height:4px;border-radius:3px;background:#2a211a;margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:3px}
.bar i.low{background:linear-gradient(90deg,#7a3a2c,var(--bad))}
.stockcard .amt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--mu)}
.stockcard .acts{position:absolute;top:11px;right:11px;display:flex;gap:5px;opacity:0;transition:.15s}
.stockcard:hover .acts{opacity:1}
.iconmini{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);color:var(--mu2);display:grid;place-items:center;font-size:12px}
.iconmini:hover{color:var(--gold);border-color:var(--gold-d)}

/* ---------- 调制 ---------- */
.mixwrap{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
.searchbar{position:relative;margin-bottom:11px}
.searchbar .inp{padding-left:32px}
.searchbar::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu2);font-size:15px}
.reclist{max-height:calc(100vh - 230px);overflow-y:auto;padding-right:4px}
.reclist::-webkit-scrollbar{width:6px}
.reclist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.recitem{padding:9px 12px;border-radius:8px;cursor:pointer;transition:.13s;border:1px solid transparent}
.recitem:hover{background:var(--panel)}
.recitem.on{background:var(--panel2);border-color:var(--gold-d)}
.recitem .rn{font-size:13.5px;font-weight:500}
.recitem .rg{font-size:11px;color:var(--mu2);margin-top:1px}
.recitem .rt{font-size:10.5px;color:var(--mu2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.rd{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rd:last-child{border-bottom:none}
.rd .l1{font-size:13.5px}
.rd .l2{font-family:var(--mono);font-size:12px;color:var(--mu);text-align:right;white-space:nowrap}
.rd .st{grid-column:1/-1;font-size:11px;margin-top:-3px}
.stockbar{height:3px;background:#2a211a;border-radius:2px;margin-top:5px;overflow:hidden}
.stockbar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.stockbar i.low{background:var(--bad)}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:7px 0 7px 30px;font-size:13.5px;color:#ddd3c4;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:none}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:8px;width:19px;height:19px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line2);color:var(--gold);
  font-family:var(--mono);font-size:10.5px;display:grid;place-items:center;
}
.servings{display:flex;gap:5px;align-items:center}
.servings button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--mu);font-family:var(--mono)}
.servings button.on{background:var(--gold);color:#1a1409;border-color:var(--gold);font-weight:700}
.servings button:hover{border-color:var(--gold-d)}

/* ---------- 台账 ---------- */
.ledgerlist{display:flex;flex-direction:column;gap:9px}
.led{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center}
.led .num{font-family:var(--mono);font-size:11px;color:var(--mu2);width:46px}
.led .nm{font-weight:600;font-size:13.5px}
.led .dt{font-family:var(--mono);font-size:11px;color:var(--mu2);margin-top:2px}
.led .amt{font-family:var(--mono);font-size:12.5px;color:var(--mu);text-align:right;white-space:nowrap}
.led .amt b{color:var(--tx);font-weight:600}
.filterbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.filterbar select{padding:7px 10px;background:#16110d;border:1px solid var(--line);border-radius:8px;font-size:13px}

/* ---------- 小票 ---------- */
.receiptwrap{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.receipt{
  width:320px;max-width:100%;margin:0 auto;background:var(--paper);color:var(--ink);
  padding:24px 20px 22px;font:12px/1.6 var(--mono);position:relative;
  box-shadow:0 20px 55px rgba(0,0,0,.5);color-adjust:exact;-webkit-print-color-adjust:exact;
}
.receipt::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(120,100,70,.05) 0 1px,transparent 1px 3px);
}
.rcenter{text-align:center}
.rlogo{font-size:19px;letter-spacing:5px;font-weight:700;margin-bottom:3px}
.rsub{font-size:9.5px;letter-spacing:2.4px;color:#7a6b55;margin-bottom:12px}
.rstore{font-size:14px;letter-spacing:2px;font-weight:700;margin-bottom:2px}
.rstoresub{font-size:9px;letter-spacing:1.6px;color:#7a6b55;margin-bottom:12px}
.rrule{border:none;border-top:1px dashed #a3947a;margin:9px 0}
.rrule2{border:none;border-top:3px double #6f6047;margin:12px 0}
.rrow{display:flex;justify-content:space-between;gap:10px}
.rrow .k{color:#5c5142}
.rrow .v{font-weight:600;white-space:nowrap}
.rrow.g3{display:grid;grid-template-columns:1fr auto 58px;gap:8px;align-items:baseline}
.rrow.g3 .amt{text-align:right;font-weight:600}
.rrow.g3 .rname{font-weight:400}
.rsec{font-size:9.5px;letter-spacing:1.8px;color:#7a6b55;margin:12px 0 5px;text-transform:uppercase}
.rname{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfoot{text-align:center;margin-top:16px;font-size:10px;color:#6b5d48;letter-spacing:1px}
.rbarcode{
  margin:14px auto 0;width:112px;height:38px;
  background:repeating-linear-gradient(90deg,#3a3128 0 1px,transparent 1px 3px,#3a3128 3px 5px,transparent 5px 7px,#3a3128 7px 8px,transparent 8px 11px);
}
.rtot{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:3px 0}
.bigline{border-top:1px solid #b8a88c;margin-top:7px;padding-top:6px}
.printbar{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(8,6,4,.72);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:15px}
.modal .body{padding:18px 20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.fld{margin-bottom:13px}
.fld .hint{font-size:11px;color:var(--mu2);margin-top:4px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:99;
  background:#2a2118;border:1px solid var(--gold-d);color:var(--tx);padding:11px 20px;border-radius:9px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 35px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{border-color:var(--bad)}
#toast.ok{border-color:var(--ok)}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .mixwrap{grid-template-columns:1fr}
  .reclist{max-height:290px}
  .receiptwrap{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:16px 13px 60px}
  .topbar{padding:10px 13px;gap:10px}
  .brand{order:1;flex:1;min-width:0}
  .brand h1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnSettings{order:2}
  .tabs{order:3;margin-left:0;width:100%;overflow-x:auto;justify-content:flex-start}
  .tabs button{padding:6px 12px;font-size:12.5px;flex:1 0 auto}
  .led{grid-template-columns:auto 1fr;row-gap:6px}
  .led .amt{grid-column:2;text-align:left}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat .v{font-size:19px}
  .receipt{width:100%;padding:18px 14px}
  .rrow.g3{grid-template-columns:1fr auto 54px}
}

/* ---------- 打印 ---------- */
@media print{
  @page{margin:5mm}
  body{background:#fff;color:#000}
  body::before{display:none}
  .topbar,.noprint,#toast,.mask{display:none !important}
  main{padding:0;max-width:none}
  .receiptwrap{display:block !important}
  .receipt{
    box-shadow:none;margin:0 auto;width:70mm;padding:5mm 4mm;background:#fff;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  body.print-a4 .receipt{width:150mm}
  .rbarcode{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rrow .k,.rsec,.rfoot,.rstoresub{color:#3a3128}
  .receipt::after{opacity:.15}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">◑</span>
    <div>
      <h1 id="barNameTitle">家庭调酒台账</h1>
      <p>HOME BAR LEDGER</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="cabinet">酒柜</button>
    <button data-v="mix">调制</button>
    <button data-v="ledger">台账</button>
    <button data-v="statement">账单</button>
  </nav>
  <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
</header>

<main id="app"></main>
<div id="toast"></div>
<div id="modalHost"></div>

<script>
/*__DATA__*/
</script>
<script>
"use strict";
/* ============================ 常量 ============================ */
const RECIPES = DATA.recipes;
const ING_META = DATA.ingredients;
const BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const KEY = 'hbl.v1';
const ML_PER_OZ = 29.5735;

/* ============================ 状态 ============================ */
let db = load();
let view = 'cabinet';
let ui = {
  mixSel: RECIPES[0] ? RECIPES[0].id : null,
  mixQ: '',
  servings: 1,
  ledgerMonth: 'all',
  stmtMonth: curMonth(),
  printMode: '80',
  showEn: false,
};

function defaults(){
  return {
    stock: {},   // name -> {name,sizeMl,price,unopened,openedMl,note}
    ledger: [],  // {id,ts,recipeId,name,servings,lines:[{n,ml,before:{unopened,openedMl}}],totalMl,cost,note}
    settings: { barName:'我的家庭吧', barSub:'HOME BAR', owner:'', currency:'¥' }
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const d = JSON.parse(raw);
    return Object.assign(defaults(), d, { settings: Object.assign(defaults().settings, d.settings||{}) });
  }catch(e){ return defaults(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

function eMonth(e){
  const d=new Date(e.ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function curMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(m){
  if(m==='all') return '全部';
  const [y,mm]=m.split('-');
  return y+'年'+Number(mm)+'月';
}
function monthShift(m,delta){
  const [y,mm]=m.split('-').map(Number);
  const d=new Date(y,mm-1+delta,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function fmtDate(ts){
  const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function money(n){ return (n==null?'—':db.settings.currency + n.toFixed(2)); }
function money0(n){ return (n==null?'—':db.settings.currency + Math.round(n)); }
function num(n){ return (Math.round(n*10)/10).toLocaleString('en-US'); }
function zhOf(n){ return (ING_META[n]&&ING_META[n].zh)||''; }
/** 中文名 → 英文规范名（用于库存键归一，避免同一原料存成两个 key） */
const ZH2EN = (()=>{ const m={}; for(const k in ING_META){ if(ING_META[k].zh) m[ING_META[k].zh]=k; } return m; })();
function canonicalName(n){
  const t=(n||'').trim();
  if(!t) return '';
  if(ING_META[t]) return t;
  return ZH2EN[t] || t;
}
/** 显示名：中文名 + 英文原名 */
function label(n){
  const z=zhOf(n);
  return z ? `${z} <span class="tiny dim">${esc(n)}</span>` : esc(n);
}
function ml(n){ return (Math.round(n*10)/10) + ' ml'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,kind){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='on '+(kind||'');
  clearTimeout(t._h); t._h=setTimeout(()=>t.className='',2400);
}

/* ============================ 库存计算 ============================ */
function stockEntry(name){
  const k=canonicalName(name);
  return db.stock[k] || { name:k, sizeMl:0, price:null, unopened:0, openedMl:0, note:'' };
}
function availMl(name){
  const s = db.stock[canonicalName(name)];
  if(!s) return 0;
  return (s.unopened||0)*(s.sizeMl||0) + (s.openedMl||0);
}
function unitCost(name){
  const s = stockEntry(name);
  if(s.price==null || !s.sizeMl) return null;
  return s.price / s.sizeMl;
}
function stockValue(){
  let v=0, known=true;
  for(const k in db.stock){
    const s=db.stock[k];
    if(s.price==null||!s.sizeMl){ known=false; continue; }
    v += (s.unopened||0)*s.price + (s.openedMl||0)*(s.price/s.sizeMl);
  }
  return {value:v, known};
}
/** 计算一次调制对每个原料的消耗与缺料情况。
 *  可选原料不足时按实际库存扣减（eff），不阻断操作；
 *  必需原料不足则进 missing，阻断保存。 */
function planFor(recipe, servings){
  const lines=[], missing=[];
  for(const i of recipe.ings){
    if(i.nonmetered || !i.ml) continue;
    const need = i.ml * servings;
    const have = availMl(i.n);
    const ok = have >= need;
    if(!ok && !i.opt) missing.push({n:i.n, need, have});
    const eff = ok ? need : Math.min(need, have);
    if(eff <= 0) continue;
    lines.push({n:i.n, ml:eff, need, have, ok, opt:!!i.opt});
  }
  return {lines, missing};
}
/** 从库存扣减。line.ml 已是实际应扣量。返回扣减明细（带 before 快照，供撤销还原） */
function deduct(lines){
  const snap=[];
  for(const l of lines){
    const name=canonicalName(l.n), need=l.ml;
    if(need<=0) continue;
    if(!db.stock[name]) db.stock[name]={name,sizeMl:0,price:null,unopened:0,openedMl:0,note:''};
    const s=db.stock[name];
    if(s.price==null) s.price = (RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===name)||{}).refPrice ?? null;
    const before={unopened:s.unopened||0, openedMl:s.openedMl||0};
    let remain=need;
    if(s.openedMl>0){ const t=Math.min(s.openedMl,remain); s.openedMl-=t; remain-=t; }
    while(remain>0 && s.unopened>0 && s.sizeMl>0){
      s.unopened--; s.openedMl += s.sizeMl;
      const t=Math.min(s.openedMl,remain); s.openedMl-=t; remain-=t;
    }
    const taken=need-remain;
    snap.push({n:name, ml:taken, before});
    if(remain>0.001) snap[snap.length-1].short=remain;
  }
  return snap;
}
function restore(snap){
  for(const l of snap){
    const s=db.stock[l.n];
    if(!s) continue;
    s.unopened=l.before.unopened; s.openedMl=l.before.openedMl;
  }
}
/** 一杯的总成本（只算有价的原料） */
function costOf(lines){
  let c=0, all=true;
  for(const l of lines){
    const u=unitCost(l.n);
    if(u==null){ all=false; continue; }
    c += u*l.ml;
  }
  return {cost:c, complete:all};
}

    <div class="rtot bigline"><span>原料成本 COST</span><span>${money(d.cost)}</span></div>
    ${d.unpriced?'<div class="rrow" style="opacity:.7"><span class="k" style="font-size:10.5px">* 部分原料未标价，成本为估算值</span><span></span></div>':''}
    <div class="rrow" style="opacity:.8"><span class="k">库存剩余估值</span><span class="v">${d.sv.known?money(d.sv.value):'部分未标价'}</span></div>
    <div class="rrow" style="opacity:.8"><span class="k">上月出品</span><span class="v">${d.prevCups} 杯</span></div>

    <div class="rbarcode"></div>
    <div class="rfoot">谢谢惠顾 · THANK YOU<br>调得开心，别喝太多</div>
  </div>`;
}

/* ============================ 交互 ============================ */
function bind(){
  // 标签页
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick=()=>{ view=b.dataset.v; render(); };
  });
  const q=document.getElementById('mixQ');
  if(q){
    q.oninput=()=>{
      ui.mixQ=q.value;
      const pos=q.selectionStart;
      render();
      const nq=document.getElementById('mixQ');
      if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); }
    };
  }
  const en=document.getElementById('showEn');
  if(en) en.onchange=()=>{ ui.showEn=en.checked; render(); };
  const lm=document.getElementById('ledgerMonth');
  if(lm) lm.onchange=()=>{ ui.ledgerMonth=lm.value; render(); };
  const sm=document.getElementById('stmtMonth');
  if(sm) sm.onchange=()=>{ ui.stmtMonth=sm.value; render(); };
  if(view==='cabinet') renderCanMake();

  document.querySelectorAll('[data-act]').forEach(el=>{
    el.onclick=(ev)=>{ ev.stopPropagation(); handle(el.dataset.act, el.dataset, el); };
  });
}

function handle(act,d){
  switch(act){
    case 'addstock': return stockForm(null);
    case 'editstock': return stockForm(d.name);
    case 'delstock': return delStock(d.name);
    case 'selrecipe': ui.mixSel=d.id; ui.servings=1; return render();
    case 'serv': ui.servings=+d.n; return render();
    case 'record': return recordDrink(d.id);
    case 'gorecipe': view='mix'; ui.mixSel=d.id; ui.servings=1; ui.mixQ=''; return render();
    case 'undorec': return undoRecord(d.id);
    case 'clearledger': return clearLedger();
    case 'stmtprev': ui.stmtMonth=monthShift(ui.stmtMonth,-1); return render();
    case 'stmtnext': ui.stmtMonth=monthShift(ui.stmtMonth,1); return render();
    case 'print': return doPrint(d.mode);
    case 'copyreceipt': return copyReceipt();
    case 'import': return importData();
    case 'export': return exportData();
    case 'seedbar': return seedBar();
  }
}

/* --- 原料表单 --- */
function stockForm(name){
  const s=name?stockEntry(name):{name:'',sizeMl:0,price:null,unopened:0,openedMl:0};
  const names=Object.keys(ING_META).sort((a,b)=>a.localeCompare(b,'en'));
  const opts=names.map(n=>`<option value="${esc(n)}" ${n===s.name?'selected':''}>${esc(n)}</option>`).join('');
  openModal(name?'编辑原料':'添加原料', `
    <div class="fld">
      <label class="lb">原料名称</label>
      <input class="inp" id="fName" list="ingList" value="${esc(s.name)}" placeholder="如 Gin / 金酒">
      <datalist id="ingList">${opts}</datalist>
      <div class="hint">从配方库选过的原料会自动带出分类与参考价</div>
    </div>
    <div class="row" style="gap:10px">
      <div class="fld sp"><label class="lb">整瓶数</label><input class="inp" id="fUnopened" type="number" min="0" step="1" value="${s.unopened||0}"></div>
      <div class="fld sp"><label class="lb">规格 (ml/瓶)</label><input class="inp" id="fSize" type="number" min="0" step="1" value="${s.sizeMl||''}"></div>
    </div>
    <div class="row" style="gap:10px">
      <div class="fld sp"><label class="lb">已开封余量 (ml)</label><input class="inp" id="fOpened" type="number" min="0" step="1" value="${s.openedMl||0}"></div>
      <div class="fld sp"><label class="lb">整瓶单价</label><input class="inp" id="fPrice" type="number" min="0" step="0.01" value="${s.price!=null?s.price:''}" placeholder="可留空"></div>
    </div>
    <div class="fld"><label class="lb">备注</label><input class="inp" id="fNote" value="${esc(s.note||'')}" placeholder="品牌 / 批次 / 开封日期"></div>
  `, (body,close)=>{
    body.querySelector('#fName').onchange=(e)=>{
      const n=canonicalName(e.target.value);
      if(n!==e.target.value.trim()) e.target.value=n;
      const meta=ING_META[n];
      if(meta && !body.querySelector('#fSize').value){
        const found=RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===n);
        if(found && found.refSize) body.querySelector('#fSize').value=found.refSize;
      }
      if(meta && !body.querySelector('#fPrice').value){
        const found=RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===n);
        if(found && found.refPrice!=null) body.querySelector('#fPrice').value=found.refPrice;
      }
    };
    body.querySelector('#mSave').onclick=()=>{
      const raw=body.querySelector('#fName').value.trim();
      if(!raw){ toast('原料名不能为空','bad'); return; }
      const n=canonicalName(raw);
      const unopened=Math.max(0,+body.querySelector('#fUnopened').value||0);
      const sizeMl=Math.max(0,+body.querySelector('#fSize').value||0);
      const openedMl=Math.max(0,+body.querySelector('#fOpened').value||0);
      const pv=body.querySelector('#fPrice').value;
      db.stock[n]={name:n,sizeMl,price:(pv===''?null:+pv),unopened,openedMl,note:body.querySelector('#fNote').value.trim()};
      save(); close(); render(); toast(n+' 已入库','ok');
    };
    const del=body.querySelector('#delStock');
    if(del) del.onclick=()=>{ close(); delStock(name); };
  }, {extraFooter: name?`<button class="btn danger" id="delStock">删除</button>`:''});
}

/* --- 删除原料 --- */
function delStock(name){
  const used=db.ledger.filter(e=>(e.lines||[]).some(l=>l.n===name)).length;
  confirmModal('从酒柜移除？',
    `「${name}」将被删除${used?`，历史台账里有 ${used} 条记录引用它（不受影响）`:''}。`, ()=>{
      delete db.stock[name];
      save(); render(); toast(name+' 已移出酒柜');
    });
}

/* --- 一键载入常备酒柜 --- */
const STARTER_BAR = [
  ['Gin',1],['Vodka',1],['Bourbon Whiskey',1],['Light Rum',1],['Tequila Blanco',1],
  ['Sweet Vermouth',1],['Dry Vermouth',1],['Campari',1],['Aperol',1],['Cointreau',1],
  ['Angostura aromatic bitters',1],['Club soda',1],['Tonic water',1],
  ['Lemon juice',1],['Lime juice',1],['Simple Syrup',1],
];
function seedBar(){
  let n=0;
  for(const [name,bottles] of STARTER_BAR){
    const found=RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===name);
    if(!found) continue;
    if(db.stock[name]) continue;
    db.stock[name]={name, sizeMl:found.refSize||750, price:(found.refPrice!=null?found.refPrice:null), unopened:bottles, openedMl:0, note:'常备'};
    n++;
  }
  save(); render(); toast(n?n+' 种常备原料已入库':'常备酒柜已在库中','ok');
}

/* --- 记录一杯 --- */
function recordDrink(id){
  const r=BY_ID[id]; if(!r) return;
  const plan=planFor(r, ui.servings);
  if(plan.missing.length){ toast('还缺：'+plan.missing.map(m=>m.n).join('、'),'bad'); return; }
  const snap=deduct(plan.lines);
  const totalMl=plan.lines.reduce((s,l)=>s+l.ml,0);
  const c=costOf(plan.lines);
  const seq=(db.ledger.reduce((mx,e)=>Math.max(mx,e.seq||0),0))+1;
  db.ledger.push({
    id:'e'+Date.now()+Math.random().toString(36).slice(2,7),
    seq, ts:Date.now(), recipeId:r.id, name:r.name, servings:ui.servings,
    lines:snap, totalMl, cost:c.cost, complete:c.complete
  });
  save(); render();
  toast('记下了 '+ui.servings+' 杯 '+r.name,'ok');
}

/* --- 撤销 --- */
function undoRecord(id){
  const e=db.ledger.find(x=>x.id===id); if(!e) return;
  confirmModal('撤销这条记录？', `「${e.name}」用掉的原料会退回酒柜。`, ()=>{
    restore(e.lines||[]);
    db.ledger=db.ledger.filter(x=>x.id!==id);
    save(); render(); toast('已撤销，原料已退回','ok');
  });
}

/* --- 清空 --- */
function clearLedger(){
  if(!db.ledger.length){ toast('台账本来就是空的'); return; }
  confirmModal('清空整个台账？', `${db.ledger.length} 条记录会被删除。此操作不可撤销，库存不会被自动退回。`, ()=>{
    db.ledger=[]; save(); render(); toast('台账已清空');
  });
}

/* --- 导入导出 --- */
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='home-bar-ledger-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('备份已导出','ok');
}
function importData(){
  openModal('导入备份','<div class="fld"><label class="lb">选择 .json 文件</label><input class="inp" type="file" id="fFile" accept="application/json"></div><div class="hint">导入会覆盖当前全部数据</div>',(body,close)=>{
    body.querySelector('#fFile').onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const d=JSON.parse(rd.result);
          if(!d.stock||!d.ledger) throw new Error('格式不对');
          db=Object.assign(defaults(),d,{settings:Object.assign(defaults().settings,d.settings||{})});
          save(); close(); render(); toast('导入成功','ok');
        }catch(err){ toast('导入失败：'+err.message,'bad'); }
      };
      rd.readAsText(f);
    };
  }, {extraFooter:'', hideSave:true});
}
function doPrint(mode){
  document.body.classList.toggle('print-a4', mode==='a4');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-a4'),500);
}
function copyReceipt(){
  const m=ui.stmtMonth;
  const ents=db.ledger.filter(e=>eMonth(e)===m);
  const byIng={},byRec={};
  let cups=0,vol=0,cost=0;
  for(const e of ents){
    cups+=e.servings; vol+=e.totalMl||0; cost+=e.cost||0;
    byRec[e.name]=(byRec[e.name]||0)+e.servings;
    for(const l of e.lines||[]) byIng[l.n]=(byIng[l.n]||0)+l.ml;
  }
  const L=[];
  L.push('◑ '+db.settings.barName+' — '+monthLabel(m)+' 结算单');
  L.push('─'.repeat(28));
  L.push('出品：');
  for(const [n,c] of Object.entries(byRec)) L.push('  '+n+' ×'+c);
  L.push('原料消耗：');
  for(const [n,v] of Object.entries(byIng).sort((a,b)=>b[1]-a[1])) L.push('  '+n+'  '+v.toFixed(0)+'ml');
  L.push('─'.repeat(28));
  L.push('总杯数 '+cups+' 杯 / 原料 '+Math.round(vol)+'ml');
  L.push('原料成本 '+money(cost));
  L.push('谢谢惠顾');
  const text=L.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('账单文本已复制','ok'),()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('账单文本已复制','ok'); }
  catch(e){ toast('复制失败，请手动选择','bad'); }
  ta.remove();
}

/* --- 弹窗 --- */
function openModal(title, bodyHTML, onMount, opts){
  opts=opts||{};
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal">
    <header><h3>${title}</h3><button class="iconbtn" id="mClose">✕</button></header>
    <div class="body">${bodyHTML}</div>
    <footer>${opts.extraFooter||''}<button class="btn" id="mCancel">取消</button>${opts.hideSave?'':'<button class="btn gold" id="mSave">保存</button>'}</footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mClose').onclick=close;
  document.getElementById('mCancel').onclick=close;
  const ms=document.getElementById('mSave'); if(ms) ms.onclick=close;
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
  if(onMount) onMount(host.querySelector('.modal'),close);
}
function confirmModal(title,msg,onYes){
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal" style="max-width:400px">
    <header><h3>${title}</h3></header>
    <div class="body"><div style="color:var(--mu);font-size:13.5px">${msg}</div></div>
    <footer><button class="btn" id="mNo">取消</button><button class="btn gold" id="mYes">确定</button></footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mNo').onclick=close;
  document.getElementById('mYes').onclick=()=>{ close(); onYes(); };
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
}

/* ============================ 设置 ============================ */
function openSettings(){
  const s=db.settings;
  openModal('设置','<div class="fld"><label class="lb">吧台名称</label><input class="inp" id="sName" value="'+esc(s.barName)+'"></div>'+
    '<div class="fld"><label class="lb">副标题（小票上显示）</label><input class="inp" id="sSub" value="'+esc(s.barSub)+'"></div>'+
    '<div class="row" style="gap:10px"><div class="fld sp"><label class="lb">调酒师署名</label><input class="inp" id="sOwner" value="'+esc(s.owner)+'"></div>'+
    '<div class="fld sp"><label class="lb">货币符号</label><input class="inp" id="sCur" value="'+esc(s.currency)+'"></div></div>'+
    '<div class="hint" style="color:var(--mu2);font-size:11.5px">配方数据来自 bar-assistant/data (MIT) · 663 款开源配方中的 '+RECIPES.length+' 款经典</div>',
  (body,close)=>{
    body.querySelector('#mSave').onclick=()=>{
      db.settings.barName=body.querySelector('#sName').value.trim()||'我的家庭吧';
      db.settings.barSub=body.querySelector('#sSub').value.trim();
      db.settings.owner=body.querySelector('#sOwner').value.trim();
      db.settings.currency=body.querySelector('#sCur').value.trim()||'¥';
      save(); close(); render(); toast('设置已保存','ok');
    };
  });
}
document.getElementById('btnSettings').onclick=openSettings;

/* ============================ 启动 ============================ */
render();
</script>
