        <div class="quick" data-quick="fUnopened" data-vals="1,2,3,6"></div>
      </div>
    </div>
    <div class="fld">
      <label class="lb">规格 (ml/瓶)</label>
      <div class="row" style="gap:8px">
        <div class="step"><button type="button" data-step="fSize" data-d="-25">−</button><input id="fSize" type="number" min="0" step="25" value="${s.sizeMl||''}"><button type="button" data-step="fSize" data-d="25">+</button></div>
        <div class="quick" data-quick="fSize" data-vals="100,375,700,750,1000"></div>
      </div>
    </div>
    <div class="fld">
      <label class="lb">已开封余量 (ml)</label>
      <div class="sliderrow">
        <input type="range" id="fOpened" min="0" max="750" step="10" value="${s.openedMl||0}">
        <span class="slabel" id="fOpenedVal">${s.openedMl||0} ml</span>
      </div>
      <div class="quick" data-quick="fOpened" data-vals="0,150,300,500,700"></div>
    </div>
    <div class="fld">
      <label class="lb">整瓶单价</label>
      <div class="sliderrow">
        <input type="range" id="fPrice" min="0" max="600" step="5" value="${s.price!=null?s.price:0}">
        <span class="slabel" id="fPriceVal">${s.price!=null?s.price:0}</span>
      </div>
      <div class="quick" data-quick="fPrice" data-vals="50,100,150,200,300,500"></div>
    </div>
    <div class="fld"><label class="lb">备注</label><input class="inp" id="fNote" value="${esc(s.note||'')}" placeholder="品牌 / 批次 / 开封日期"></div>
  `, (body,close)=>{
    /* ---- 步进器 ---- */
    body.querySelectorAll('[data-step]').forEach(b=>{
      b.onclick=()=>{
        const el=body.querySelector('#'+b.dataset.step);
        const step = b.dataset.step==='fUnopened' ? 1 : 25;
        let v = (+el.value||0) + (+b.dataset.d)*step;
        if(b.dataset.step==='fSize') v = Math.max(0, Math.round(v/25)*25);
        if(b.dataset.step==='fUnopened') v = Math.max(0, Math.round(v));
        el.value = v;
        el.dispatchEvent(new Event('input',{bubbles:true}));
        el.dispatchEvent(new Event('change',{bubbles:true}));
        syncSliders();
      };
    });
    /* ---- 快捷值 ---- */
    body.querySelectorAll('[data-quick]').forEach(q=>{
      q.innerHTML = q.dataset.vals.split(',').map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('');
      q.querySelectorAll('button').forEach(b=>{
        b.onclick=()=>{
          const target=body.querySelector('#'+q.dataset.quick);
          target.value = b.dataset.v;
          target.dispatchEvent(new Event('input',{bubbles:true}));
          target.dispatchEvent(new Event('change',{bubbles:true}));
          q.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
          syncSliders();
        };
      });
    });
    /* ---- 滑块联动 ---- */
    function syncSliders(){
      const size=+body.querySelector('#fSize').value||0;
      const op=body.querySelector('#fOpened');
      op.max = size > 0 ? size : 750;   // 上限跟随规格；规格未填时给个默认值
      if(+op.value > +op.max) op.value = op.max;
      body.querySelector('#fOpenedVal').textContent = op.value+' ml';
      body.querySelector('#fPriceVal').textContent = body.querySelector('#fPrice').value;
    }
    // 记录用户是否手动改过单价 —— 滑块初值是 0（非空），不能用「值为空」判断是否已填
    let priceDirty=false;
    ['fSize','fOpened','fPrice'].forEach(id=>{
      const el=body.querySelector('#'+id);
      el.addEventListener('input',()=>{ if(id==='fPrice') priceDirty=true; syncSliders(); });
      el.addEventListener('change',()=>{ if(id==='fPrice') priceDirty=true; syncSliders(); });
    });
    syncSliders();

    const nameEl = body.querySelector('#fName');
    const catRow = body.querySelector('#fCats');
    const gridBox = body.querySelector('#fGrid');
    const prevBox = body.querySelector('#fPrev');
    let selCat = '全部';

    function refOf(n){
      return RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===n);
    }
    function applyMeta(n, force){
      const meta = ING_META[n];
      if(!meta) return;
      const ref = refOf(n);
      const sizeEl = body.querySelector('#fSize');
      const priceEl = body.querySelector('#fPrice');
      if(ref && ref.refSize && (force || !sizeEl.value)) sizeEl.value = ref.refSize;
      if(ref && ref.refPrice!=null && (force || !priceDirty)) priceEl.value = ref.refPrice;
      // 预览
      if(prevBox){
        prevBox.classList.add('on');
        prevBox.innerHTML = '<div class="fptitle">'+esc(meta.z||n)
          + (meta.z ? ' <span class="tiny dim">'+esc(n)+'</span>' : '')
          + '</div>'
          + '<div class="fpmeta">'
          + '<span class="pill">'+esc(meta.catTopZh||meta.cat||'其他')+'</span>'
          + (meta.abv?'<span class="pill">'+meta.abv+'% ABV</span>':'')
          + (ref&&ref.refSize?'<span class="pill">标准规格 '+ref.refSize+'ml</span>':'')
          + (ref&&ref.refPrice!=null?'<span class="pill gold">参考价 '+db.settings.currency+ref.refPrice+'</span>':'<span class="pill">参考价未收录</span>')
          + '</div>';
      }
    }
    // 分类列表：按原料数降序，「全部」排最前
    const CAT_ORDER = ['全部'];
    const catCount = {};
    for(const x of ING_LIST) catCount[x.cat] = (catCount[x.cat]||0)+1;
    const cats = Object.keys(catCount).sort((a,b)=>catCount[b]-catCount[a]);
    CAT_ORDER.push(...cats);
    catRow.innerHTML = CAT_ORDER.map(c =>
      '<button class="fcat'+(c===selCat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)
      + (c==='全部' ? '' : '<i>'+catCount[c]+'</i>') + '</button>'
    ).join('');
    catRow.querySelectorAll('.fcat').forEach(b=>{
      b.onclick=()=>{
        selCat = b.dataset.c;
        catRow.querySelectorAll('.fcat').forEach(x=>x.classList.toggle('on', x===b));
        nameEl.value = '';        // 切分类时清掉搜索词，网格含义才明确
        renderGrid();
      };
    });

    function currentList(){
      const q = nameEl.value.trim().toLowerCase();
      if(q) return ING_LIST.filter(x =>
        x.n.toLowerCase().includes(q) || (x.z && x.z.toLowerCase().includes(q)));
      if(selCat==='全部') return ING_LIST;
      return ING_LIST.filter(x => x.cat === selCat);
    }
    function renderGrid(){
      const q = nameEl.value.trim();
      const list = currentList();
      const head = body.querySelector('#fGridHead');
      head.innerHTML = q
        ? '搜索「<b>'+esc(q)+'</b>」 · '+list.length+' 种'
        : '<b>'+esc(selCat)+'</b> · '+list.length+' 种';
      if(!list.length){
        gridBox.innerHTML = '<div class="fempty">没找到「'+esc(q)+'」，可直接保存为自定义原料</div>';
        return;
      }
      gridBox.innerHTML = list.map(x =>
        '<button class="fcell" data-n="'+esc(x.n)+'" title="'+esc(x.n)+'">'
        + '<div class="n">'+esc(x.z||x.n)+'</div>'
        + '</button>').join('');
      gridBox.querySelectorAll('.fcell').forEach(el=>{
        el.onclick=()=>{ pick(el.dataset.n); };
      });
    }
    function pick(n){
      if(!n) return;
      nameEl.value = n;
      applyMeta(n, true);
      gridBox.querySelectorAll('.fcell').forEach(el=>el.classList.toggle('on', el.dataset.n===n));
    }
    nameEl.addEventListener('input', ()=>{
      renderGrid();
      const n = canonicalName(nameEl.value.trim());
      if(n && ING_META[n]) applyMeta(n, false);
      else prevBox.classList.remove('on');
    });
    nameEl.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const n = canonicalName(nameEl.value.trim());
        if(n && ING_META[n]){ nameEl.value = n; applyMeta(n, true); }
      }
    });
    nameEl.onchange=(e)=>{
      const n=canonicalName(e.target.value.trim());
      if(n!==e.target.value.trim()) e.target.value=n;
      if(n && ING_META[n]) applyMeta(n, false);
      else prevBox.classList.remove('on');
    };
    renderGrid();
    if(s.name && ING_META[s.name]){
      applyMeta(s.name, false);
      gridBox.querySelectorAll('.fcell').forEach(el=>el.classList.toggle('on', el.dataset.n===s.name));
    }
    body.querySelector('#mSave').onclick=()=>{
      const raw=body.querySelector('#fName').value.trim();
      if(!raw){ toast('原料名不能为空','bad'); return; }
      const n=canonicalName(raw);
      const unopened=Math.max(0,+body.querySelector('#fUnopened').value||0);
      const sizeMl=Math.max(0,+body.querySelector('#fSize').value||0);
      const openedMl=Math.max(0,+body.querySelector('#fOpened').value||0);
      const pv=body.querySelector('#fPrice').value;
      db.stock[n]={name:n,sizeMl,price:(pv===''?null:+pv),unopened,openedMl,note:body.querySelector('#fNote').value.trim()};
      save();
      // 保存后不关弹窗：清空原料名，焦点回到输入框，可连续添加
      nameEl.value='';
      const noteEl=body.querySelector('#fNote'); if(noteEl) noteEl.value='';
      nameEl.focus();
      render();                 // 只刷新底层页面，弹窗保持打开
      toast(n+' 已入库，可继续添加下一项','ok');
    };
    const del=body.querySelector('#delStock');
    if(del) del.onclick=()=>{ close(); delStock(name); };
  }, {extraFooter: name?`<button class="btn danger" id="delStock">删除</button>`:''});
}

/* --- 删除原料 --- */
function delStock(name){
  const used=db.ledger.filter(e=>(e.lines||[]).some(l=>l.n===name)).length;
  confirmModal('从酒柜移除？',
    `「${name}」将被删除${used?`，历史台账里有 ${used} 条记录引用它（不受影响）`:''}。`, ()=>{
      delete db.stock[name];
      save(); render(); toast(name+' 已移出酒柜');
    });
}

/* --- 一键载入常备酒柜 --- */
const STARTER_BAR = [
  ['Gin',1],['Vodka',1],['Bourbon Whiskey',1],['Light Rum',1],['Tequila Blanco',1],
  ['Sweet Vermouth',1],['Dry Vermouth',1],['Campari',1],['Aperol',1],['Cointreau',1],
  ['Angostura aromatic bitters',1],['Club soda',1],['Tonic water',1],
  ['Lemon juice',1],['Lime juice',1],['Simple Syrup',1],
];
function seedBar(){
  let n=0;
  for(const [name,bottles] of STARTER_BAR){
    const found=RECIPES.flatMap(r=>r.ings).find(i=>canonicalName(i.n)===name);
    if(!found) continue;
    if(db.stock[name]) continue;
    db.stock[name]={name, sizeMl:found.refSize||750, price:(found.refPrice!=null?found.refPrice:null), unopened:bottles, openedMl:0, note:'常备'};
    n++;
  }
  save(); render(); toast(n?n+' 种常备原料已入库':'常备酒柜已在库中','ok');
}

/* --- 记录一杯 --- */
function recordDrink(id){
  const r=BY_ID[id]; if(!r) return;
  const plan=planFor(r, ui.servings);
  if(plan.missing.length){ toast('还缺：'+plan.missing.map(m=>m.n).join('、'),'bad'); return; }
  const snap=deduct(plan.lines);
  const totalMl=plan.lines.reduce((s,l)=>s+l.ml,0);
  const c=costOf(plan.lines);
  const seq=(db.ledger.reduce((mx,e)=>Math.max(mx,e.seq||0),0))+1;
  db.ledger.push({
    id:'e'+Date.now()+Math.random().toString(36).slice(2,7),
    seq, ts:Date.now(), recipeId:r.id, name:r.name, servings:ui.servings,
    lines:snap, totalMl, cost:c.cost, complete:c.complete
  });
  save(); render();
  toast('记下了 '+ui.servings+' 杯 '+r.name,'ok');
}

/* --- 撤销 --- */
function undoRecord(id){
  const e=db.ledger.find(x=>x.id===id); if(!e) return;
  confirmModal('撤销这条记录？', `「${e.name}」用掉的原料会退回酒柜。`, ()=>{
    restore(e.lines||[]);
    db.ledger=db.ledger.filter(x=>x.id!==id);
    save(); render(); toast('已撤销，原料已退回','ok');
  });
}

/* --- 清空 --- */
function clearLedger(){
  if(!db.ledger.length){ toast('台账本来就是空的'); return; }
  confirmModal('清空整个台账？', `${db.ledger.length} 条记录会被删除。此操作不可撤销，库存不会被自动退回。`, ()=>{
    db.ledger=[]; save(); render(); toast('台账已清空');
  });
}

/* --- 导入导出 --- */
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='home-bar-ledger-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('备份已导出','ok');
}
function importData(){
  openModal('导入备份','<div class="fld"><label class="lb">选择 .json 文件</label><input class="inp" type="file" id="fFile" accept="application/json"></div><div class="hint">导入会覆盖当前全部数据</div>',(body,close)=>{
    body.querySelector('#fFile').onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const d=JSON.parse(rd.result);
          if(!d.stock||!d.ledger) throw new Error('格式不对');
          db=migrate(d);
          save(); close(); render(); toast('导入成功','ok');
        }catch(err){ toast('导入失败：'+err.message,'bad'); }
      };
      rd.readAsText(f);
    };
  }, {extraFooter:'', hideSave:true});
}
function doPrint(mode){
  document.body.classList.toggle('print-a4', mode==='a4');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-a4'),500);
}
function copyReceipt(){
  const m=ui.stmtMonth;
  const ents=db.ledger.filter(e=>eMonth(e)===m);
  const byIng={},byRec={};
  let cups=0,vol=0,cost=0;
  for(const e of ents){
    cups+=e.servings; vol+=e.totalMl||0; cost+=e.cost||0;
    byRec[e.name]=(byRec[e.name]||0)+e.servings;
    for(const l of e.lines||[]) byIng[l.n]=(byIng[l.n]||0)+l.ml;
  }
  const L=[];
  L.push('◑ '+db.settings.barName+' — '+monthLabel(m)+' 结算单');
  L.push('─'.repeat(28));
  L.push('出品：');
  for(const [n,c] of Object.entries(byRec)) L.push('  '+n+' ×'+c);
  L.push('原料消耗：');
  for(const [n,v] of Object.entries(byIng).sort((a,b)=>b[1]-a[1])) L.push('  '+n+'  '+v.toFixed(0)+'ml');
  L.push('─'.repeat(28));
  L.push('总杯数 '+cups+' 杯 / 原料 '+Math.round(vol)+'ml');
  L.push('原料成本 '+money(cost));
  L.push('谢谢惠顾');
  const text=L.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('账单文本已复制','ok'),()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('账单文本已复制','ok'); }
  catch(e){ toast('复制失败，请手动选择','bad'); }
  ta.remove();
}

/* --- 弹窗 --- */
function openModal(title, bodyHTML, onMount, opts){
  opts=opts||{};
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal${opts.wide?' wide':''}">
    <header><h3>${title}</h3><button class="iconbtn" id="mClose">✕</button></header>
    <div class="body">${bodyHTML}</div>
    <footer>${opts.extraFooter||''}<button class="btn" id="mCancel">取消</button>${opts.hideSave?'':'<button class="btn gold" id="mSave">保存</button>'}</footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mClose').onclick=close;
  document.getElementById('mCancel').onclick=close;
  const ms=document.getElementById('mSave'); if(ms) ms.onclick=close;
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
  if(onMount) onMount(host.querySelector('.modal'),close);
}
function confirmModal(title,msg,onYes){
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="mask" id="mask"><div class="modal" style="max-width:400px">
    <header><h3>${title}</h3></header>
    <div class="body"><div style="color:var(--mu);font-size:13.5px">${msg}</div></div>
    <footer><button class="btn" id="mNo">取消</button><button class="btn gold" id="mYes">确定</button></footer>
  </div></div>`;
  const close=()=>{ host.innerHTML=''; };
  document.getElementById('mNo').onclick=close;
  document.getElementById('mYes').onclick=()=>{ close(); onYes(); };
  document.getElementById('mask').onclick=(e)=>{ if(e.target.id==='mask') close(); };
}

/* ============================ 设置 ============================ */
function openSettings(){
  const s=db.settings;
  const rc = s.receipt || {};
  const PAPERS=[['classic','经典米黄'],['white','纯白'],['kraft','牛皮纸'],['dark','深色']];
  const FONTS=[['紧凑','紧凑'],['标准','标准'],['大','大']];

  /* ---------- 通用行构造 ---------- */
  const row=(title,desc,ctl)=>
    `<div class="setrow"><div class="stxt"><div class="stitle">${title}</div>${desc?`<div class="sdesc">${desc}</div>`:''}</div><div class="sctl">${ctl}</div></div>`;
  const sw=(id,on)=>`<button class="sw ${on?'on':''}" data-sw="${id}" role="switch" aria-checked="${on?'true':'false'}"></button>`;
  const seg=(name,opts,cur)=>`<div class="seg">${opts.map(([v,n])=>`<button data-seg="${name}" data-v="${v}" class="${cur===v?'on':''}">${n}</button>`).join('')}</div>`;

  const themeCards = [['auto','跟随系统'],['dark','深色'],['light','浅色']].map(([k,label])=>{
    const t = THEMES[k==='auto'?'dark':k];
    const half = k==='auto' ? 'background:linear-gradient(90deg,#14100d 50%,#ece6db 50%)' : 'background:'+t.bg;
    return `<button class="theme ${s.theme===k?'on':''}" data-theme-pick="${k}">
      <span class="prev" style="${half}">
        <i style="background:${t.p1}"></i><i style="background:${t.p2}"></i><i style="background:${t.acc}"></i>
      </span>
      <span class="nm">${label}</span></button>`;
  }).join('');

  const bodyHTML =
    '<div class="settabs" id="setTabs">'
    + '<button class="settab on" data-t="appearance">外观</button>'
    + '<button class="settab" data-t="receipt">小票</button>'
    + '<button class="settab" data-t="data">数据</button>'
    + '<button class="settab" data-t="about">关于</button>'
    + '</div>'

    /* ================= 外观 ================= */
    + '<div class="setpanel" data-p="appearance">'
    +   '<div class="setsection">'
    +     '<div class="setlabel">主题</div>'
    +     '<div class="themes">'+themeCards+'</div>'
    +     row('强调色','按钮、高亮、指标条与选中态统一使用', `<div class="swatches">${ACCENTS.map(a=>
            `<button class="swatch ${s.accent===a.k?'on':''}" data-accent="${a.k}" title="${a.label}" style="background:${a.c};color:${a.c}"></button>`).join('')}</div>`)
    +   '</div>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">背景纹理</div>'
    +     row('EROS 浮雕满印','45° 倾斜的几何字标，浅色主题自动反相为凹陷刻纹',
            sw('bgTex', s.bgTex!==false))
    +     row('不透明度','纹理在页面上的浓度',
            `<input type="range" id="sBgOpacity" min="0" max="100" value="${Math.round((s.bgTexOpacity!=null?s.bgTexOpacity:.5)*100)}" style="width:120px"><span class="setval" id="sBgOpVal">${Math.round((s.bgTexOpacity!=null?s.bgTexOpacity:.5)*100)}%</span>`)
    +     row('纹理间距','平铺单元的边长，越大越稀疏',
            `<input type="range" id="sBgSize" min="160" max="400" step="20" value="${s.bgTexSize||260}" style="width:120px"><span class="setval" id="sBgSizeVal">${s.bgTexSize||260}px</span>`)
    +   '</div>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">排版与动效</div>'
    +     row('字号','全局基础字号', seg('fontSize', FONTS, s.fontSize||'标准'))
    +     row('界面动效','卡片进场、悬停等过渡动画', sw('motion', s.motion!==false))
    +   '</div>'
    + '</div>'

    /* ================= 小票 ================= */
    + '<div class="setpanel" data-p="receipt" hidden>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">基本信息</div>'
    +     row('吧台名称','显示在小票顶部', `<input class="inp" id="sName" value="${esc(s.barName||'')}" style="width:180px">`)
    +     row('副标题','小票上名称下方的一行小字', `<input class="inp" id="sSub" value="${esc(s.barSub||'')}" style="width:180px">`)
    +     row('调酒师署名','小票上的署名行', `<input class="inp" id="sOwner" value="${esc(s.owner||'')}" style="width:180px">`)
    +     row('货币符号','成本金额前的符号', `<input class="inp" id="sCur" value="${esc(s.currency||'¥')}" style="width:80px">`)
    +   '</div>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">纸张</div>'
    +     row('纸张样式','四种预设纸面',
            `<div class="papers">${PAPERS.map(([k,n])=>`<button class="pchoice paper-${k} ${rc.paper===k?'on':''}" data-p="'+k+'" title="${n}">${n.slice(0,2)}</button>`).join('')}</div>`)
    +     row('背景图','上传后自动压缩到 420px 存在本地',
            `<input class="inp" type="file" id="sBg" accept="image/*" style="width:190px"><button class="btn sm" id="sBgClear" style="margin-left:6px">清除</button>`)
    +     row('背景不透明度','背景图在纸面上的浓度',
            `<input type="range" id="sOpacity" min="0" max="100" value="${Math.round((rc.bgOpacity!=null?rc.bgOpacity:.25)*100)}" style="width:120px"><span class="setval" id="sOpVal">${Math.round((rc.bgOpacity!=null?rc.bgOpacity:.25)*100)}%</span>`)
    +   '</div>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">内容</div>'
    +     row('显示「原料消耗」明细','关掉后小票只列出品清单与成本', sw('showIng', !!rc.showIngredients))
    +     row('自定义文案','出现在条形码上方，可留空',
            `<input class="inp" id="sNote" value="${esc(rc.note||'')}" placeholder="本月战绩…" style="width:190px">`)
    +     row('落款第一行','', `<input class="inp" id="sFoot" value="${esc(rc.foot||'谢谢惠顾 · THANK YOU')}" style="width:190px">`)
    +     row('落款第二行','', `<input class="inp" id="sFoot2" value="${esc(rc.foot2||'调得开心，别喝太多')}" style="width:190px">`)
    +   '</div>'
    + '</div>'

    /* ================= 数据 ================= */
    + '<div class="setpanel" data-p="data" hidden>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">备份</div>'
    +     row('导出备份','把酒柜、台账与设置导出为 JSON 文件', `<button class="btn sm" data-act="export">导出</button>`)
    +     row('导入备份','从 JSON 文件恢复，会覆盖当前全部数据', `<button class="btn sm" data-act="import">导入</button>`)
    +   '</div>'
    +   '<div class="setsection setdanger">'
    +     '<div class="setlabel">危险操作</div>'
    +     row('清空全部数据','删除酒柜、全部台账记录与设置，无法撤销', `<button class="btn sm danger" data-act="wipe">清空</button>`)
    +   '</div>'
    + '</div>'

    /* ================= 关于 ================= */
    + '<div class="setpanel" data-p="about" hidden>'
    +   '<div class="setsection">'
    +     '<div class="setlabel">关于</div>'
    +     '<div class="setrow"><div class="stxt">'
    +       '<div class="stitle">家庭调酒台账 · Home Bar Ledger</div>'
    +       '<div class="sdesc">单文件 · 纯前端 · 离线可用的家庭酒吧消耗账本<br>'
    +       '配方 '+RECIPES.length+' 款 · 原料 '+Object.keys(ING_META).length+' 种 · 全部已中文化<br>'
    +       '配方数据来自 <a href="https://github.com/bar-assistant/data" target="_blank">bar-assistant/data</a>（MIT）<br>'
    +       '仓库：<a href="https://github.com/Erostanni/home-bar-ledger" target="_blank">Erostanni/home-bar-ledger</a></div>'
    +     '</div></div>'
    +   '</div>'
    + '</div>';

  openModal('设置', bodyHTML, (body,close)=>{
    const st=db.settings;
    st.receipt = st.receipt || {paper:'classic',showIngredients:false,note:'',foot:'',foot2:'',bgImage:null,bgOpacity:.25};
    st.bgTexOpacity = st.bgTexOpacity!=null?st.bgTexOpacity:.5;
    st.bgTexSize = st.bgTexSize||260;
    st.theme = st.theme||'dark';
    st.accent = st.accent||'gold';

    const save=()=>{ save_(); };
    const save_=()=>{ try{ localStorage.setItem('hbl.v1', JSON.stringify(db)); }catch(e){} };

    /* ---- 分区切换 ---- */
    body.querySelectorAll('#setTabs .settab').forEach(t=>{
      t.onclick=()=>{
        body.querySelectorAll('#setTabs .settab').forEach(x=>x.classList.toggle('on',x===t));
        body.querySelectorAll('.setpanel').forEach(p=>p.hidden = p.dataset.p!==t.dataset.t);
      };
    });

    /* ---- 主题卡片 ---- */
    body.querySelectorAll('[data-theme-pick]').forEach(b=>{
      b.onclick=()=>{
        st.theme=b.dataset.themePick;
        body.querySelectorAll('[data-theme-pick]').forEach(x=>x.classList.toggle('on',x===b));
        applyTheme(); save_();
      };
    });
    // 跟随系统时，系统主题变化要实时反映
    if(window.matchMedia){
      const mq=window.matchMedia('(prefers-color-scheme: light)');
      const onMq=(e)=>{ if(st.theme==='auto'){ applyTheme(); } };
      if(mq.addEventListener) mq.addEventListener('change',onMq);
      else if(mq.addListener) mq.addListener(onMq);
    }

    /* ---- 强调色 ---- */
    body.querySelectorAll('[data-accent]').forEach(b=>{
      b.onclick=()=>{
        st.accent=b.dataset.accent;
        body.querySelectorAll('[data-accent]').forEach(x=>x.classList.toggle('on',x===b));
        applyTheme(); save_();
      };
    });

    /* ---- 开关 ---- */
    body.querySelectorAll('[data-sw]').forEach(b=>{
      b.onclick=()=>{
        const k=b.dataset.sw;
        const on=!b.classList.contains('on');
        b.classList.toggle('on',on);
        b.setAttribute('aria-checked', on?'true':'false');
        if(k==='bgTex') st.bgTex=on;
        if(k==='motion') st.motion=on;
        if(k==='showIng') st.receipt.showIngredients=on;
        applyTheme(); save_();
      };
    });

    /* ---- 分段控件 ---- */
    body.querySelectorAll('[data-seg]').forEach(b=>{
      b.onclick=()=>{
        const name=b.dataset.seg;
        st[name]=b.dataset.v;
        body.querySelectorAll('[data-seg="'+name+'"]').forEach(x=>x.classList.toggle('on',x===b));
        applyTheme(); save_();
      };
    });

    /* ---- 滑块 ---- */
    const bop=body.querySelector('#sBgOpacity');
    bop.oninput=()=>{ body.querySelector('#sBgOpVal').textContent=bop.value+'%'; st.bgTexOpacity=bop.value/100; applyTheme(); save_(); };
    const bsz=body.querySelector('#sBgSize');
    bsz.oninput=()=>{ body.querySelector('#sBgSizeVal').textContent=bsz.value+'px'; st.bgTexSize=+bsz.value; applyTheme(); save_(); };
    const op=body.querySelector('#sOpacity');
    op.oninput=()=>{ body.querySelector('#sOpVal').textContent=op.value+'%'; st.receipt.bgOpacity=op.value/100; refreshPreview(); save_(); };

    /* ---- 小票纸张 ---- */
    body.querySelectorAll('.pchoice').forEach(b=>{
      b.onclick=()=>{
        st.receipt.paper=b.dataset.p;
        body.querySelectorAll('.pchoice').forEach(x=>x.classList.toggle('on',x===b));
        refreshPreview(); save_();
      };
    });

    /* ---- 小票文本 ---- */
    const bindText=(id,fn)=>{ const el=body.querySelector('#'+id); if(el) el.addEventListener('input',()=>{ fn(el.value); refreshPreview(); save_(); }); };
    const bindRaw=(id,fn)=>{ const el=body.querySelector('#'+id); if(el) el.addEventListener('input',()=>{ fn(el.value); save_(); }); };
    bindRaw('sName', v=>{ st.barName=v; const el=document.getElementById('barNameTitle'); if(el) el.textContent=v||'家庭调酒台账'; });
    bindRaw('sSub', v=>{ st.barSub=v; });
    bindRaw('sOwner', v=>{ st.owner=v; });
    bindRaw('sCur', v=>{ st.currency=v||'¥'; });
    bindText('sNote', v=>st.receipt.note=v);
    bindText('sFoot', v=>st.receipt.foot=v);
    bindText('sFoot2', v=>st.receipt.foot2=v);

    /* ---- 背景图 ---- */
    const bg=body.querySelector('#sBg');
    if(bg) bg.onchange=(e)=>{
      const f=e.target.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=420, sc=Math.min(1, max/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          st.receipt.bgImage=cv.toDataURL('image/jpeg',.7);
          save_(); refreshPreview(); toast('背景图已保存','ok');
        };
        img.src=fr.result;
      };
      fr.readAsDataURL(f);
    };
    const bc=body.querySelector('#sBgClear');
    if(bc) bc.onclick=()=>{ st.receipt.bgImage=null; save_(); refreshPreview(); toast('已清除背景图'); };

    /* ---- 实时预览 ---- */
    const preview=body.querySelector('#setPreview');
    function refreshPreview(){
      if(!preview) return;
      preview.innerHTML=receiptHTML(statementData(ui.stmtMonth));
    }
    refreshPreview();

    /* ---- 数据区按钮 ---- */
    body.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick=(ev)=>{
        ev.stopPropagation();
        const a=b.dataset.act;
        if(a==='export') exportData();
        else if(a==='import') importData();
        else if(a==='wipe') confirmModal('清空全部数据？','酒柜、全部台账记录与设置都会被删除，无法撤销。建议先导出备份。',()=>{
          localStorage.removeItem('hbl.v1'); db=defaults(); save(); close(); render(); toast('已清空全部数据');
        });
      };
    });
  }, {wide:true});
}
document.getElementById('btnSettings').onclick=openSettings;

/* ============================ 启动 ============================ */
render();
</script>
